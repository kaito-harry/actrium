[package]
name = "loran-issuer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Actor Identity Service (Issuer) - ActrId registration and credential issuing"

[dependencies]
# Workspace dependencies
tokio = { workspace = true }
tokio-util = "0.7"
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
axum = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }

## Actr framework dependencies
actr-protocol = { workspace = true }
actr-pack = { workspace = true }
actr-relay-security = { path = "../actr-relay-security", version = "0.11.0" }
prost = { workspace = true }
prost-types = { workspace = true }

## Crypto dependencies
ed25519-dalek = { workspace = true }
hmac = { workspace = true }
sha2 = { workspace = true }
sha1 = "0.10"
aes-gcm = "0.10"

## Database
sqlx.workspace = true

## Utilities
async-trait = { workspace = true }
base64 = { workspace = true }
hex = { workspace = true }
rand = "0.8.5"

## Rate limiting
tower_governor = "0.8"
tower = "0.5"
tower-http = { version = "0.5", features = ["cors"] }
governor = "0.10"


# Internal dependencies
platform = { path = "../loran-platform", package = "loran-platform", version = "0.11.0" }
signer = { path = "../loran-signer", package = "loran-signer", version = "0.11.0" }
loran-publisher-registry = { path = "../loran-publisher-registry", version = "0.11.0" }

[dev-dependencies]
actr-hyper = { workspace = true }
actr-mock-loran = { workspace = true }
turn = { path = "../loran-turn", package = "loran-turn", version = "0.11.0" }
turn_crate = { workspace = true }
tempfile = { workspace = true }
nonce-auth = { workspace = true }
tonic = { workspace = true }
serial_test = { workspace = true }
rand = "0.8.5"
prost = { workspace = true }

[lib]
name = "issuer"

[lints]
workspace = true
