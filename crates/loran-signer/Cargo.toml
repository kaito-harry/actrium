[package]
name = "loran-signer"
version.workspace = true
edition.workspace = true
repository.workspace = true
description = "Signer - Ed25519 signing key generation and management service; private keys never leave Signer"
license.workspace = true
rust-version.workspace = true

[features]
default = ["backend-sqlite"]
backend-sqlite = ["sqlx"]                                             # SQLite uses sqlx
backend-postgres = ["sqlx"]
backend-all = ["backend-sqlite", "backend-postgres"]

[dependencies]
# Workspace dependencies
tokio = { workspace = true, features = ["full"] }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
axum = { workspace = true }
uuid = { workspace = true, features = ["v4"] }

# gRPC dependencies
tonic = { workspace = true }
tonic-prost = { workspace = true }
prost = { workspace = true }
prost-types = { workspace = true }
tokio-stream = "0.1.17"

# Crypto dependencies
ed25519-dalek = { workspace = true }
base64 = { workspace = true }
aes-gcm = "0.10"              # AES-256-GCM for KEK encryption

# Storage backends
# SQLite and PostgreSQL - unified async interface via sqlx
sqlx = { workspace = true, default-features = false, features = [
    "postgres",
    "macros",
], optional = true }

# HTTP client for testing
reqwest = { workspace = true }

# Authentication and security
nonce-auth = { workspace = true }
hmac = { workspace = true }
sha2 = { workspace = true }

# Utilities
rand = "0.8.5"
hex = { workspace = true }
async-trait = "0.1"

# Internal dependencies
loran-proto = { path = "../loran-proto", version = "0.11.0" }
# Note: circular dependency avoided - platform depends on signer for client types

# Monitoring
prometheus = "0.14"
lazy_static = "1.4"

[dev-dependencies]
tower = "0.5"
hyper = "1.0"
tempfile = { workspace = true }
toml = { version = "0.8" }
ed25519-dalek = { workspace = true }

[lib]
name = "signer"

[lints]
workspace = true
