[package]
name = "loran-turn"
version.workspace = true
edition.workspace = true
repository.workspace = true
description = "WebRTC TURN service implementation for Loran"
license.workspace = true
rust-version.workspace = true

[features]
test-utils = []

[[example]]
name = "browser_interop"
required-features = ["test-utils"]

[dependencies]
turn_crate = { workspace = true }
webrtc-util = { workspace = true }
async-trait = { workspace = true }

tokio = { workspace = true }
tracing = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
webrtc = { workspace = true }
md5 = "0.8"
hmac = { workspace = true }
sha1 = "0.10"

serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
base64 = { workspace = true }
lru = "0.18.2"

platform = { path = "../loran-platform", package = "loran-platform", version = "0.11.0" }
actr-protocol = { workspace = true }
prost = { workspace = true }
prost-types = { workspace = true }
nonce-auth = { workspace = true }
hex = { workspace = true }

[dev-dependencies]
md5 = "0.8"
sha2 = "0.10"
stun-protocol = { workspace = true }
tokio = { workspace = true, features = ["macros", "test-util"] }
serial_test = { workspace = true }
uuid = { workspace = true, features = ["v4"] }
tempfile = { workspace = true }
ed25519-dalek = { workspace = true }
sqlx = { workspace = true }

[lib]
name = "turn"

[lints]
workspace = true
