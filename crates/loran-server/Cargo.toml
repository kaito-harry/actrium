[package]
name = "loran-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Collection of WebRTC auxiliary servers including Signaling, STUN and TURN services"

[[bin]]
name = "loran"
path = "src/main.rs"

[features]
default = ["admin-ui"]
admin-ui = ["dep:mime_guess"]
opentelemetry = [
    "dep:opentelemetry",
    "dep:opentelemetry_sdk",
    "dep:opentelemetry-otlp",
    "dep:opentelemetry-appender-tracing",
    "dep:opentelemetry-http",
    "dep:tracing-opentelemetry",
    "platform/opentelemetry",
    "signaling/opentelemetry",
]

[dependencies]
uuid = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = [
    "env-filter",
    "json",
    "registry",
    "time",
] }
tracing-appender = "0.2"
serde = { workspace = true }
serde_json = { workspace = true }
clap = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
axum.workspace = true
tower-http = { version = "0.5", features = ["trace", "cors"] }
tower-service = "0.3"
# Rustls related dependencies
rustls = { workspace = true }
tokio-rustls = { workspace = true }
webpki-roots = "1.0.10"

# Axum related
tokio-util = { version = "0.7.13", features = ["io"] }
axum-server = { version = "0.8.0", default-features = false, features = [
    "tls-rustls",
] }

# Local dependencies
loran-sdk = { path = "../loran-sdk", version = "0.11.0" }
actr-protocol = { workspace = true }
loran-packages = { path = "../loran-packages", version = "0.11.0" }
platform = { path = "../loran-platform", package = "loran-platform", version = "0.11.0" }
signaling = { path = "../loran-signaling", package = "loran-signaling", version = "0.11.0" }
stun = { path = "../loran-stun", package = "loran-stun", version = "0.11.0" }
turn = { path = "../loran-turn", package = "loran-turn", version = "0.11.0" }
issuer = { path = "../loran-issuer", package = "loran-issuer", version = "0.11.0" }
loran-publisher-registry = { path = "../loran-publisher-registry", version = "0.11.0" }
signer = { path = "../loran-signer", package = "loran-signer", version = "0.11.0" }
actr-relay-security = { path = "../actr-relay-security", version = "0.11.0" }
loran-relay = { path = "../loran-relay", version = "0.11.0" }
loran-relay-protocol = { path = "../loran-relay-protocol", version = "0.11.0" }
turn_crate = { workspace = true }
rand = "0.9.1"
futures = "0.3.31"
num_cpus = "1.16.0"
core_affinity = "0.8.3"
once_cell = "1.21.3"
url = "2.5.4"
tokio-tungstenite = { workspace = true }
hostname = "0.4.0"
base64 = { workspace = true }
subtle = "2"
hex = { workspace = true }
async-trait = "0.1.88"
strum = { version = "0.26", features = ["derive"] }
toml = { version = "0.8" }
nonce-auth = { workspace = true }
chrono = { workspace = true }
hmac = { workspace = true }
reqwest = { workspace = true }
typetag = "0.2.20"
pwrzv = { version = "0.7.0" }
tonic = { workspace = true }
prometheus = "0.14"
lazy_static = "1.4"
jsonwebtoken = { version = "10.3", default-features = false, features = ["aws_lc_rs"] }
argon2 = "0.5"
mime_guess = { version = "2", optional = true }
sqlx.workspace = true

# OpenTelemetry dependencies (optional, enabled by feature)
opentelemetry = { version = "0.32.0", features = ["trace", "logs"], optional = true }
opentelemetry_sdk = { version = "0.32.1", features = ["rt-tokio", "logs"], optional = true }
opentelemetry-otlp = { version = "0.32.0", features = ["grpc-tonic", "http-proto", "tls", "logs"], optional = true }
opentelemetry-appender-tracing = { version = "0.32.0", optional = true }
opentelemetry-http = { version = "0.32.0", optional = true }
tracing-opentelemetry = { version = "0.33.0", optional = true }

# Unix specific dependencies for privilege dropping
[target.'cfg(unix)'.dependencies]
nix = { version = "0.30", features = ["user", "fs"] }

[dev-dependencies]
turn = { path = "../loran-turn", package = "loran-turn", version = "0.11.0", features = ["test-utils"] }
loran-sdk = { path = "../loran-sdk", version = "0.11.0", features = ["testing"] }
platform = { path = "../loran-platform", package = "loran-platform", version = "0.11.0" }
rcgen = "0.14.8"
stun-protocol = { workspace = true }
tempfile = { workspace = true }
tower = { version = "0.5", features = ["util"] }
reqwest = { workspace = true, features = ["json"] }
urlencoding = "2.1"
base64 = { workspace = true }
libc = "0.2"
actr-runtime = { workspace = true }
actr-runtime-mailbox = { workspace = true }
prost = { workspace = true }
serial_test = "3.3"
ed25519-dalek = { version = "2", features = ["rand_core"] }
hmac = { workspace = true }
sha1 = "0.10"
opentelemetry-proto = { version = "0.32.0", default-features = false, features = ["gen-tonic", "trace"] }

[lints]
workspace = true
