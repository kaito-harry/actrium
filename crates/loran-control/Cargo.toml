[package]
name = "loran-admin"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Admin control-plane implementation for loran nodes"

[dependencies]
tonic = { workspace = true }
tokio = { workspace = true, features = ["full"] }

thiserror = { workspace = true }
tracing = { workspace = true }

serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }

hex = { workspace = true }
sha2 = { workspace = true }
nonce-auth = { workspace = true }
pwrzv = { version = "0.7.0" }

sqlx = { workspace = true }

platform = { path = "../loran-platform", package = "loran-platform", version = "0.11.0" }
loran-proto = { path = "../loran-proto", version = "0.11.0" }
loran-issuer = { path = "../loran-issuer", version = "0.11.0" }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.30", features = ["signal"] }

[lib]
name = "admin"

[lints]
workspace = true
