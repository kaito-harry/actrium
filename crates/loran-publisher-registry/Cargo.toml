[package]
name = "loran-publisher-registry"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Loran Publisher Registry - domain identity and signed Actor packages"

[dependencies]
# Workspace dependencies
actr-protocol = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
axum = { workspace = true }
ed25519-dalek = { workspace = true }
base64 = { workspace = true }
chrono = { workspace = true }
sha2 = { workspace = true }
toml = { version = "0.8" }
sqlx.workspace = true

# Not in workspace
rand = "0.8"
hex = "0.4"
url = "2"

# Internal dependencies
platform = { path = "../loran-platform", package = "loran-platform", version = "0.10.7" }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tempfile = { workspace = true }
serial_test = { workspace = true }

[lints]
workspace = true
