[package]
name = "loran-publisher-registry"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Loran Publisher Registry - Publisher domain identity and signing keys"

[dependencies]
# Workspace dependencies
actr-protocol = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
axum = { workspace = true }
ed25519-dalek = { workspace = true }
base64 = { workspace = true }
chrono = { workspace = true }
sha2 = { workspace = true }
sqlx.workspace = true

# Not in workspace
url = "2"

# Internal dependencies
platform = { path = "../loran-platform", package = "loran-platform", version = "0.11.0" }

[dev-dependencies]
rand.workspace = true
tower = { version = "0.5", features = ["util"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tempfile = { workspace = true }
serial_test = { workspace = true }

[lints]
workspace = true
