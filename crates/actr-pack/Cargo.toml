[package]
name = "actr-pack"
version = "0.10.7"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "ACTR package format: ZIP STORE-based .actr file reading, writing, signing and verification"

[lints]
workspace = true

[features]
actrium-application = ["dep:actr-service-compat", "dep:semver", "dep:serde_json", "dep:wasmparser"]

[dependencies]
zip = { version = "9.0.3", default-features = false, features = ["deflate"] }
sha2.workspace = true
ed25519-dalek.workspace = true
toml.workspace = true
serde = { version = "1.0", features = ["derive"] }
base64.workspace = true
hex = "0.4"
thiserror.workspace = true
tracing.workspace = true
actr-protocol.workspace = true
actr-service-compat = { workspace = true, features = ["standalone-proto"], optional = true }
semver = { version = "1", optional = true }
serde_json = { workspace = true, optional = true }
wasmparser = { version = "0.254.2", default-features = false, features = ["std", "component-model"], optional = true }

[dev-dependencies]
rand.workspace = true
