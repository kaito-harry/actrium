[package]
name = "actr-pack"
version = "0.11.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "ACTR package format: ZIP STORE-based .actr file reading, writing, signing and verification"

[lints]
workspace = true

[features]
profile-validation = [
    "dep:actr-framework",
    "dep:actr-service-compat",
    "dep:serde_json",
    "dep:wasmparser",
    "dep:wit-component",
    "dep:wit-parser",
]

[dependencies]
semver = "1"
zip = { version = "9.0.3", default-features = false, features = ["deflate"] }
sha2.workspace = true
ed25519-dalek.workspace = true
toml.workspace = true
serde = { version = "1.0", features = ["derive"] }
base64.workspace = true
hex = "0.4"
thiserror.workspace = true
tracing.workspace = true
actr-protocol.workspace = true
actr-framework = { workspace = true, optional = true }
actr-service-compat = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
wasmparser = { version = "0.254.2", default-features = false, features = ["std", "component-model", "validate", "features", "simd"], optional = true }
wit-component = { version = "0.254.2", optional = true }
wit-parser = { version = "0.254.2", optional = true }

[dev-dependencies]
rand.workspace = true
