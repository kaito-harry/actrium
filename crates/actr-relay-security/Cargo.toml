[package]
name = "actr-relay-security"
version = "0.11.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Authenticated Noise sessions for native and browser relay adapters"

[lints]
workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
ed25519-dalek = "2"
zeroize = "1"
getrandom = "0.2"
sha2 = "0.10"
subtle = "2"
snow = { version = "0.10", default-features = false, features = ["default-resolver", "use-curve25519", "use-chacha20poly1305", "use-sha2"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }
