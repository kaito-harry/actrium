[package]
name = "actr-mock-loran"
version = "0.11.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Mock loran server (WS signaling + HTTP Issuer + Publisher Registry) for Actor-RTC integration tests"

[[bin]]
name = "mock-loran"
path = "src/bin/mock_loran.rs"

[dependencies]
actr-relay-security = { path = "../actr-relay-security", version = "0.11.0" }
actr-protocol = { workspace = true }
loran-relay = { path = "../loran-relay", version = "0.11.0" }
loran-relay-protocol = { path = "../loran-relay-protocol", version = "0.11.0" }
async-trait.workspace = true

tokio = { workspace = true }
tokio-util = { version = "0.7", features = ["rt"] }
futures-util = { workspace = true }
prost = { workspace = true }
prost-types = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
ed25519-dalek = { workspace = true }
sha2 = { workspace = true }
rand = { workspace = true }
anyhow = { workspace = true }
base64 = { workspace = true }

# HTTP + WebSocket server (axum handles same-port WS upgrade + REST routes)
axum = { version = "0.8", features = ["ws"] }
tower-http = { version = "0.6", features = ["cors"] }
bytes = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
hex = "0.4"

# CLI binary argument parsing
clap = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "json"] }

[lints]
workspace = true
