[package]
name = "actr-service-compat"
version = "0.10.7"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Actor service protocol compatibility analysis using semantic proto schema comparison"
keywords = [
    "actor",
    "protobuf",
    "compatibility",
    "breaking-changes",
    "service",
]
repository = "https://github.com/Actrium/actrium"
readme = "README.md"

[lints]
workspace = true

[features]
standalone-proto = ["dep:protobuf-parse", "dep:serde_json", "dep:tempfile"]

[dependencies]
# Core dependencies for service compatibility analysis
actr-protocol.workspace = true
proto-fingerprint.workspace = true

# Serialization support
serde = { version = "1.0", features = ["derive"] }

# Error handling
thiserror.workspace = true
anyhow = "1.0"

# Time handling for fingerprint metadata
chrono = { version = "0.4", features = ["serde"] }

# Cryptographic hashing
sha2 = "0.10"
protobuf-parse = { version = "3.7.2", optional = true }
serde_json = { workspace = true, optional = true }
tempfile = { workspace = true, optional = true }
