[package]
name = "actr-framework-protoc-codegen"
version = "0.11.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Protoc plugin for generating actr-framework code from protobuf definitions"
repository = "https://github.com/Actrium/actrium"
readme = "README.md"
keywords = ["actor", "codegen", "protobuf", "protoc", "plugin"]
categories = ["development-tools", "development-tools::build-utils"]

[lints]
workspace = true

[dependencies]
# Framework dependencies
actr-framework.workspace = true
actr-protocol.workspace = true

# Protobuf support
prost = "0.14"
prost-build.workspace = true
prost-types = "0.14"
prost-reflect = { version = "0.16", features = ["derive"] }
bytes = "1.10"

# rust-protobuf is required alongside prost: prost drops unknown fields when
# decoding, so the explicit `(actr.payload_type)` option (extension tag
# 50001) can only be recovered through rust-protobuf's unknown-fields API.
protobuf = "3.7"

# Code generation
quote = "1.0"
proc-macro2 = "1.0"
heck = "0.5"

# Utilities
anyhow = "1.0"
thiserror.workspace = true
async-trait = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
hex = "0.4"

[dev-dependencies]
tempfile.workspace = true

[[bin]]
name = "protoc-gen-actrframework"
path = "src/bin/protoc-gen-actrframework.rs"

[lib]
name = "actr_framework_protoc_codegen"
path = "src/lib.rs"
