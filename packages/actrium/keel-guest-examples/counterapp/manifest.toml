format = "actr-package/2"

[actor]
publisher = "actrium"
name = "counter"
version = "1.0.0"

[workload]
profile = "keel.guest/1"
entry = "workload/guest.js"

[workload.keel]
runtime = "js"
guest-api = "keel.guest/1"

[host]
profile = "actr.host/1"
api = "^1.0.0"
required-capabilities = ["ui.render"]
optional-capabilities = []

[actrium]
title = "Counter"
description = "A minimal stateful Keel Guest example"
left-panel-default-visible = false
right-panel-default-visible = false

[signature]
algorithm = "ed25519"
key-id = "placeholder"

