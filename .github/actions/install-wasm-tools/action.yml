name: Pinned WebAssembly tools
description: Reuse the checksum-pinned Linux x86_64 binaries used by CI tests.
inputs:
  wasm-pack-only:
    description: Install only wasm-pack
    default: 'false'
runs:
  using: composite
  steps:
  - name: Install prebuilt WebAssembly tools
    env:
      WASM_PACK_SHA256: c09f971ecaed9a2efc80fdcea7a00ef6b53c7fadc8c57d1f61b53a6aa66b668a
      WASM_COMPONENT_LD_SHA256: e5cee677052c0eb6b5d0605f85e3bbc46d076050cd3403406f49b3503f22622c
      WASM_TOOLS_SHA256: 4e2898f7ca3bd0536218ed9b7b36ff7b86954c57ae0e6272fde69728cbe01088
    run: |
      set -euo pipefail
      mkdir -p "$HOME/.cargo/bin"
      install_binary() {
        local name="$1"
        local expected="$2"
        local url="$3"
        local sha256="$4"
        if "$HOME/.cargo/bin/$name" --version 2>/dev/null | grep -Eq "$expected"; then
          echo "Reusing image $name"
          return
        fi
        local archive="$RUNNER_TEMP/$name.tar.gz"
        local extract_dir
        extract_dir=$(mktemp -d "$RUNNER_TEMP/$name.XXXXXX")

        curl --fail --location --retry 3 --retry-all-errors --output "$archive" "$url"
        echo "$sha256  $archive" | sha256sum --check --status
        tar --extract --gzip --file "$archive" --strip-components=1 --directory "$extract_dir"
        install --mode=0755 "$extract_dir/$name" "$HOME/.cargo/bin/$name"
        rm -rf "$archive" "$extract_dir"
        "$HOME/.cargo/bin/$name" --version | grep -Eq "$expected"
      }

      install_binary wasm-pack '^wasm-pack 0\.15\.0$' \
        https://github.com/wasm-bindgen/wasm-pack/releases/download/v0.15.0/wasm-pack-v0.15.0-x86_64-unknown-linux-musl.tar.gz \
        "$WASM_PACK_SHA256"
      if [[ "${{ inputs.wasm-pack-only }}" != true ]]; then
      install_binary wasm-component-ld '^wasm-component-ld 0\.5\.26$' \
        https://github.com/bytecodealliance/wasm-component-ld/releases/download/v0.5.26/wasm-component-ld-v0.5.26-x86_64-linux.tar.gz \
        "$WASM_COMPONENT_LD_SHA256"
      install_binary wasm-tools '^wasm-tools 1\.253\.0( \(.*\))?$' \
        https://github.com/bytecodealliance/wasm-tools/releases/download/v1.253.0/wasm-tools-1.253.0-x86_64-linux.tar.gz \
        "$WASM_TOOLS_SHA256"

      fi
      wasm-pack --version
      if [[ "${{ inputs.wasm-pack-only }}" != true ]]; then
        wasm-component-ld --version
        wasm-tools --version
      fi
    shell: bash
