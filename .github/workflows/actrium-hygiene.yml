name: Repository hygiene

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  large-and-vendored-files:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Test product-name policy
        run: python3 .github/scripts/check_product_names_test.py

      - name: Prevent retired product names from returning
        run: python3 scripts/actrium/check-product-names.py

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Validate Android binary asset lock
        run: >-
          java scripts/actrium/PrepareAndroidBinaryAssets.java
          --lock android/android/binary-assets.lock.properties
          --validate-only

      - name: Enforce reviewed large-file budgets
        run: scripts/actrium/check-large-files.sh

      - name: Verify vendored assets
        run: scripts/actrium/verify-vendored-assets.sh
