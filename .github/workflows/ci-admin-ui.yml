name: CI (loran Admin UI)

# The loran Admin UI is a Vite/TypeScript frontend embedded into the loran-server
# binary. It is decoupled from the Rust build (the Rust workspace builds without
# a JS toolchain), so it gets its own job that only runs when the UI changes.
on:
  push:
    branches: [main]
    paths:
      - "crates/loran-server/admin/web/**"
      - ".github/workflows/ci-admin-ui.yml"
      - ".github/workflows/_loran-release.yml"
  pull_request:
    branches: [main]
    paths:
      - "crates/loran-server/admin/web/**"
      - ".github/workflows/ci-admin-ui.yml"
      - ".github/workflows/_loran-release.yml"

permissions:
  contents: read

defaults:
  run:
    working-directory: crates/loran-server/admin/web

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Type-check & build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Setup pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.15.9 --activate

      # --ignore-workspace is required: admin/web is not a member of the root
      # pnpm workspace. Without it pnpm resolves the workspace root and installs
      # all 6 workspace projects (running unrelated lifecycle hooks that need
      # Bun) while leaving this directory without node_modules, so the build
      # cannot find vite/tsc. Keep in sync with the Build Admin UI step in
      # _loran-release.yml; changes there also trigger this workflow.
      - name: Install dependencies
        run: pnpm --ignore-workspace install --frozen-lockfile

      - name: Audit dependencies
        run: pnpm run audit:dependencies

      # `build` runs `tsc -b && vite build`, i.e. TypeScript type-check + bundle.
      - name: Type-check and build
        run: pnpm run build
