name: CI (TypeScript)

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-typescript-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-build:
    name: TypeScript Format, Lint And Build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.99.0
      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ github.token }}
          version: ${{ vars.PROTOC_VERSION || '29.3' }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/actr-typescript -> ../../target/bindings-typescript

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: packages/actr-typescript/package.json

      - name: Install dependencies
        working-directory: packages/actr-typescript
        run: npm install

      - name: Check formatting
        working-directory: packages/actr-typescript
        run: npm run format

      - name: Run lint
        working-directory: packages/actr-typescript
        run: npm run lint

      - name: Build
        working-directory: packages/actr-typescript
        run: npm run build

      - name: Run unit tests
        working-directory: packages/actr-typescript
        run: npm test

      - name: Cargo check
        working-directory: packages/actr-typescript
        run: cargo check --locked --manifest-path Cargo.toml

  workload:
    name: TypeScript Workload Authoring Check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: |
            packages/actr-typescript/actr-workload/package-lock.json
            examples/actr/typescript/echo-workload/package-lock.json

      - name: Verify TypeScript workload WIT drift
        run: |
          cmp crates/actr-framework/wit-v2/actr-workload.wit packages/actr-typescript/actr-workload/src/wit-v2/actr-workload.wit

      - name: Build TypeScript workload package
        working-directory: packages/actr-typescript/actr-workload
        run: |
          npm ci
          npm run build
          npm test
          node dist/cli.js bindings /tmp/actr-workload-ts-bindings --wit ../../../crates/actr-framework/wit-v2/actr-workload.wit
          npm pack --dry-run

      - name: Build TypeScript EchoService sources
        working-directory: examples/actr/typescript/echo-workload
        run: |
          npm ci
          npm run build

      # ComponentizeJS#335 / #54: accept only the known async-func bindgen
      # panic. Any unrelated componentization failure must still fail CI.
      - name: Componentize TypeScript EchoService workload
        run: bash .github/scripts/verify-typescript-componentize-blocker.sh
