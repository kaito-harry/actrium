name: CI (Python Codegen)

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: tools/actr/protoc-gen/python

jobs:
  build:
    name: Build & Check
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ github.token }}
          version: ${{ vars.PROTOC_VERSION || '29.3' }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: tools/actr/protoc-gen/python/pyproject.toml

      - name: Install package
        run: pip install -e .

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Smoke generate typed workload
        run: |
          tmp="$(mktemp -d)"
          mkdir -p "$tmp/protos/local" "$tmp/generated"
          cat > "$tmp/protos/local/echo.proto" <<'PROTO'
          syntax = "proto3";
          package echo;

          message EchoRequest {
            string message = 1;
          }

          message EchoResponse {
            string reply = 1;
          }

          service EchoService {
            rpc Echo(EchoRequest) returns (EchoResponse);
          }
          PROTO

          python3 - "$tmp" <<'PY'
          import hashlib, json, os, pathlib, sys
          tmp = sys.argv[1]
          spec = {
              "schema_version": "v1",
              "routes": [
                  {
                      "route_key": "echo.EchoService.Echo",
                      "proto_file": "local/echo.proto",
                      "proto_service": "echo.EchoService",
                      "method": "Echo",
                      "input_type": "echo.EchoRequest",
                      "output_type": "echo.EchoResponse",
                      "payload_type": "rpcReliable",
                      "reply_mode": "return",
                  }
              ],
          }
          canonical = json.dumps(spec, sort_keys=True, separators=(",", ":"))
          spec["spec_hash"] = hashlib.sha256(canonical.encode()).hexdigest()
          pathlib.Path(os.path.join(tmp, "dispatch_spec.json")).write_text(
              json.dumps(spec)
          )
          PY

          spec_hash=$(python3 -c 'import json,sys;print(json.load(open(sys.argv[1]))["spec_hash"])' "$tmp/dispatch_spec.json")
          protoc \
            --proto_path="$tmp/protos" \
            --python_out="$tmp/generated" \
            --plugin="protoc-gen-actrframework-python=$(command -v protoc-gen-actrframework-python)" \
            --actrframework-python_opt="dispatch_spec=$tmp/dispatch_spec.json,dispatch_spec_hash=$spec_hash" \
            --actrframework-python_out="$tmp/generated" \
            "$tmp/protos/local/echo.proto"

          python -m compileall "$tmp/generated"
          PYTHONPATH="$tmp" python - <<'PY'
          import generated.local.echo_pb2
          import generated.actr_dispatch

          assert hasattr(generated.actr_dispatch, "actr_dispatch")
          PY

          if grep -R -E "from actr import|import actr" "$tmp/generated"; then
            echo "legacy actr runtime import leaked into generated Python" >&2
            exit 1
          fi

      - name: Build package
        run: |
          python -m pip install -U build
          python -m build
