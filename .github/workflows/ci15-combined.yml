        | binary(mobile_network_event_scenarios) | binary(ice_restart) | binary(ice_restart_with_signaling_disruption) | binary(ice_restart_unilateral_outage)
        | binary(turn_credential_rotation) | binary(webrtc_large_data_transfer) | binary(webrtc_initial_connection_timeout)
        | binary(media_loopback) | binary(dynclib_actor_e2e) | binary(rust_echo) | binary(outproc_disconnect_reconnect) |
        binary(outproc_connection_rebuild) | binary(recovery_vnet_supervisor) | binary(mock_loran_integration)
