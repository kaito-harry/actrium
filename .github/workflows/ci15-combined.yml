        WASM_TOOLS_SHA256: 4e2898f7ca3bd0536218ed9b7b36ff7b86954c57ae0e6272fde69728cbe01088
        WASI_SDK_SHA256: c6c38aab56e5de88adf6c1ebc9c3ae8da72f88ec2b656fb024eda8d4167a0bc5
        WASI_ADAPTER_SHA256: 0acb10959bd3c1d2e7903ef82212910bfc156ab5698ef3f2ff669474ba59fb0a
      run: "tool_root=\"$RUNNER_TEMP/actr-native-workload-tools\"\nmkdir -p \"$tool_root\"\n\ndownload() {\n  local url=\"\
        $1\"\n  local output=\"$2\"\n  local sha256=\"$3\"\n  curl --fail --location --retry 3 --retry-all-errors \\\n   \
        \ --output \"$output\" \\\n    \"$url\"\n  echo \"$sha256  $output\" | sha256sum --check --status\n}\n\ndownload \\\
