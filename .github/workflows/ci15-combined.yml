      env:
        ACTR_SWIFT_E2E: '1'
      run: "../../target/debug/mock-loran --port 8081 > \"$RUNNER_TEMP/mock-loran.log\" 2>&1 &\nmock_pid=\"$!\"\ntrap 'kill\
        \ \"$mock_pid\" || true' EXIT\nfor _ in {1..60}; do\n  if grep -q \"mock-loran listening\" \"$RUNNER_TEMP/mock-loran.log\"\
        ; then\n    cat \"$RUNNER_TEMP/mock-loran.log\"\n    break\n  fi\n  if ! kill -0 \"$mock_pid\" 2>/dev/null; then\n\
        \    cat \"$RUNNER_TEMP/mock-loran.log\"\n    exit 1\n  fi\n  sleep 1\ndone\nif ! grep -q \"mock-loran listening\"\
        \ \"$RUNNER_TEMP/mock-loran.log\"; then\n  cat \"$RUNNER_TEMP/mock-loran.log\"\n  exit 1\nfi\nACTR_BINDINGS_PATH=dist/ActrBindings\
        \ \\\nACTR_BINARY_PATH=dist/ActrFFI.xcframework \\\nswift test\n"
    - name: Build Swift codegen package
