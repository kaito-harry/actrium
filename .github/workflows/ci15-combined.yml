        \ -c 'import json,sys;print(json.load(open(sys.argv[1]))[\"spec_hash\"])' \"$tmp/dispatch_spec.json\")\nprotoc \\\n\
        \  --proto_path=\"$tmp/protos\" \\\n  --python_out=\"$tmp/generated\" \\\n  --plugin=\"protoc-gen-actrframework-python=$(command\
        \ -v protoc-gen-actrframework-python)\" \\\n  --actrframework-python_opt=\"dispatch_spec=$tmp/dispatch_spec.json,dispatch_spec_hash=$spec_hash\"\
        \ \\\n  --actrframework-python_out=\"$tmp/generated\" \\\n  \"$tmp/protos/local/echo.proto\"\n\npython -m compileall\
        \ \"$tmp/generated\"\nPYTHONPATH=\"$tmp\" python - <<'PY'\nimport generated.local.echo_pb2\nimport generated.actr_dispatch\n\
        \nassert hasattr(generated.actr_dispatch, \"actr_dispatch\")\nPY\n\nif grep -R -E \"from actr import|import actr\"\
        \ \"$tmp/generated\"; then\n  echo \"legacy actr runtime import leaked into generated Python\" >&2\n  exit 1\nfi\n"
    - name: Build package
      run: 'python -m pip install -U build

        python -m build

        '
    - name: Record observed cache outcomes
      if: always()
      env:
        CI15_CACHE_REPORT: '[{"step": "ci15-cache-4", "action": "actions/cache@v4", "hit": "${{ steps.ci15-cache-4.outputs.cache-hit
          }}", "outcome": "${{ steps.ci15-cache-4.outcome }}"}]'
      run: echo "$CI15_CACHE_REPORT"; echo "$CI15_CACHE_REPORT" >> "$GITHUB_STEP_SUMMARY"
