  swift:
    name: Swift
    needs: determine
    if: needs.determine.outputs.swift_binding == 'true'
    runs-on: macos-latest
    permissions:
      contents: read
      actions: read
    steps:
    - uses: actions/checkout@v5
    - name: Set up Rust
      uses: dtolnay/rust-toolchain@1.99.1
      with:
        targets: aarch64-apple-darwin
    - uses: Swatinem/rust-cache@v2
      with:
        prefix-key: ${{ env.CI15_CACHE }}-rust
      id: ci15-cache-2
    - name: Install protoc
      uses: arduino/setup-protoc@v3
      with:
        repo-token: ${{ github.token }}
        version: ${{ vars.PROTOC_VERSION || '29.3' }}
    - name: Cache uniffi-bindgen binary
      id: cache-uniffi
      uses: actions/cache@v4
      with:
        path: ~/.cargo/bin/uniffi-bindgen*
        key: ${{ env.CI15_CACHE }}-uniffi-bindgen-0.31.1-${{ runner.os }}-${{ runner.arch }}
    - name: Restore verified prebuilt UniFFI bindgen
      if: steps.cache-uniffi.outputs.cache-hit != 'true' && runner.arch == 'ARM64'
      env:
        CI15_ARTIFACT_TOKEN: ${{ github.token }}
      run: |
        tool_dir=$(mktemp -d "$RUNNER_TEMP/ci15-uniffi.XXXXXX")
        trap 'rm -rf "$tool_dir"' EXIT
        archive="$tool_dir/uniffi.zip"
        if ! curl --fail --silent --show-error --location --max-time 20 \
            --header "Authorization: Bearer $CI15_ARTIFACT_TOKEN" \
            --output "$archive" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/artifacts/13930583174/zip"; then
          echo "::notice::The prebuilt UniFFI artifact is unavailable. Using the locked source installer."
          exit 0
        fi

        expected_digest=50a34435f80256bbe123af0e16781fa337d06748ee47b453ae42353edb2e7871
        printf '%s  %s\n' "$expected_digest" "$archive" | shasum -a 256 -c -
        unzip -q "$archive" -d "$tool_dir"
        cd "$tool_dir"
        shasum -a 256 -c SHA256SUMS
        test "$(cat ARCH)" = "$(uname -m)"
        rustc -vV > CURRENT_RUSTC
        if ! cmp -s RUSTC CURRENT_RUSTC; then
          echo "::notice::The prebuilt UniFFI toolchain differs. Using the locked source installer."
          exit 0
        fi

        chmod +x uniffi-bindgen
        ./uniffi-bindgen --version > ACTUAL_VERSION
        grep -Eq '^uniffi-bindgen 0\.31\.1$' ACTUAL_VERSION
        cmp VERSION ACTUAL_VERSION
        cargo_bin="${CARGO_HOME:-$HOME/.cargo}/bin"
        mkdir -p "$cargo_bin"
        install -m 0755 uniffi-bindgen "$cargo_bin/uniffi-bindgen"
    - name: Install UniFFI bindgen
      if: steps.cache-uniffi.outputs.cache-hit != 'true'
      run: "# Swatinem/rust-cache may already restore ~/.cargo/bin/uniffi-bindgen\n# from a prior run with a different key;\
        \ skip the install when the\n# binary is present so the unguarded `cargo install` doesn't abort\n# with \"binary already\
        \ exists in destination\".\nif ! command -v uniffi-bindgen >/dev/null 2>&1; then\n  cargo install --locked uniffi\
        \ --version 0.31.1 --features cli --bin uniffi-bindgen\nfi\n"
    - name: Install Swift tools and libraries
      run: brew install swiftlint opus
    - name: Run SwiftLint
