      run: 'cmp crates/actr-framework/wit-v2/actr-workload.wit crates/actr-hyper/wit-v2/actr-workload.wit

        '
    - uses: Swatinem/rust-cache@v2
      with:
        cache-targets: false
        save-if: ${{ matrix.shard == 'rest' || matrix.shard == 'rest-1' }}
        prefix-key: ${{ env.CI15_CACHE }}-rust
      id: ci15-cache-5
    - name: Run sccache-cache
      uses: mozilla-actions/sccache-action@v0.0.9
      with:
        version: v0.18.0
    - name: Candidate shared prebuilt Wasm tools
      uses: ./.github/actions/install-wasm-tools
      if: contains(github.ref_name, 'ci15-combined-candidate-')
    - name: Install prebuilt WebAssembly tools
      env:
        WASM_PACK_SHA256: c09f971ecaed9a2efc80fdcea7a00ef6b53c7fadc8c57d1f61b53a6aa66b668a
        WASM_COMPONENT_LD_SHA256: e5cee677052c0eb6b5d0605f85e3bbc46d076050cd3403406f49b3503f22622c
        WASM_TOOLS_SHA256: 4e2898f7ca3bd0536218ed9b7b36ff7b86954c57ae0e6272fde69728cbe01088
      run: "install_binary() {\n  local name=\"$1\"\n  local expected=\"$2\"\n  local url=\"$3\"\n  local sha256=\"$4\"\n\
        \  if \"$HOME/.cargo/bin/$name\" --version 2>/dev/null | grep -Eq \"$expected\"; then\n    echo \"Reusing image $name\"\
        \n    return\n  fi\n  local archive=\"$RUNNER_TEMP/$name.tar.gz\"\n  local extract_dir\n  extract_dir=$(mktemp -d\
        \ \"$RUNNER_TEMP/$name.XXXXXX\")\n\n  curl --fail --location --retry 3 --retry-all-errors --output \"$archive\" \"\
        $url\"\n  echo \"$sha256  $archive\" | sha256sum --check --status\n  tar --extract --gzip --file \"$archive\" --strip-components=1\
        \ --directory \"$extract_dir\"\n  install --mode=0755 \"$extract_dir/$name\" \"$HOME/.cargo/bin/$name\"\n  rm -rf\
        \ \"$archive\" \"$extract_dir\"\n  \"$HOME/.cargo/bin/$name\" --version | grep -Eq \"$expected\"\n}\n\ninstall_binary\
        \ wasm-pack '^wasm-pack 0\\.15\\.0$' \\\n  https://github.com/wasm-bindgen/wasm-pack/releases/download/v0.15.0/wasm-pack-v0.15.0-x86_64-unknown-linux-musl.tar.gz\
        \ \\\n  \"$WASM_PACK_SHA256\"\ninstall_binary wasm-component-ld '^wasm-component-ld 0\\.5\\.26$' \\\n  https://github.com/bytecodealliance/wasm-component-ld/releases/download/v0.5.26/wasm-component-ld-v0.5.26-x86_64-linux.tar.gz\
        \ \\\n  \"$WASM_COMPONENT_LD_SHA256\"\ninstall_binary wasm-tools '^wasm-tools 1\\.253\\.0( \\(.*\\))?$' \\\n  https://github.com/bytecodealliance/wasm-tools/releases/download/v1.253.0/wasm-tools-1.253.0-x86_64-linux.tar.gz\
        \ \\\n  \"$WASM_TOOLS_SHA256\"\n\nwasm-pack --version\nwasm-component-ld --version\nwasm-tools --version\n"
      if: '!contains(github.ref_name, ''ci15-combined-candidate-'')'
    - name: Download CLI web runtime assets
      uses: actions/download-artifact@v4
      with:
        name: cli-web-runtime
        path: crates/actr-cli/assets/web-runtime
    - name: Sync CLI source assets
      run: 'test -s crates/actr-cli/assets/web-runtime/actr_sw_host_bg.wasm

        test -s crates/actr-cli/assets/web-runtime/actr_sw_host.js

        bash packages/actr-web/scripts/sync-cli-assets.sh --skip-sw-host

        '
    - name: Install cargo-nextest
      uses: taiki-e/install-action@cargo-nextest
    - name: Build rest test inventory and verify RFC-0507 acceptance
      if: startsWith(matrix.shard, 'rest')
      run: "cargo metadata --format-version 1 --all-features --locked \\\n  > \"$RUNNER_TEMP/nextest-rest-cargo.json\"\ncargo\
        \ nextest list --workspace --all-features \\\n  --list-type binaries-only --message-format json \\\n  > \"$RUNNER_TEMP/nextest-rest-binaries.json\"\
        \ncargo nextest list \\\n  --cargo-metadata \"$RUNNER_TEMP/nextest-rest-cargo.json\" \\\n  --binaries-metadata \"\
        $RUNNER_TEMP/nextest-rest-binaries.json\" \\\n  -E \"!($REALTIME_BINARIES)\" --message-format json \\\n  > \"$RUNNER_TEMP/nextest-rest-tests.json\"\
        \npython3 - \"$RUNNER_TEMP/nextest-rest-tests.json\" <<'PY'\nimport json\nimport sys\n\nacceptance = \"outbound::peer_gate::websocket_tests::live_websocket_partial_write_is_uncertain_without_replay\"\
        \nwith open(sys.argv[1]) as source:\n    inventory = json.load(source)\nselected = []\nfor suite in inventory[\"rust-suites\"\
        ].values():\n    if suite[\"package-name\"] != \"actr-hyper\" or suite[\"kind\"] != \"lib\":\n        continue\n \
        \   case = suite.get(\"testcases\", {}).get(acceptance)\n    if case and not case[\"ignored\"] and case[\"filter-match\"\
        ][\"status\"] == \"matches\":\n        selected.append(suite[\"binary-id\"])\nif len(selected) != 1:\n    raise SystemExit(\"\
        RFC-0507 acceptance must be selected exactly once in the rest shard\")\nprint(f\"RFC-0507 acceptance selected in {selected[0]};\
        \ the rest suite runs it without retries\")\nPY\n"
    - name: Candidate assert timer selected exactly once in rest
      if: startsWith(matrix.shard, 'rest') && contains(github.ref_name, 'ci15-combined-candidate-')
      run: python3 .github/scripts/assert-ci15-timer.py "$RUNNER_TEMP/nextest-rest-tests.json"
    - name: Verify rest test partitions
      if: matrix.shard == 'rest-1' || matrix.shard == 'rest-2'
      run: |
        for part in 1 2; do
          cargo nextest list \
            --cargo-metadata "$RUNNER_TEMP/nextest-rest-cargo.json" \
            --binaries-metadata "$RUNNER_TEMP/nextest-rest-binaries.json" \
            -E "!($REALTIME_BINARIES)" --partition "hash:$part/2" --message-format json \
            > "$RUNNER_TEMP/nextest-rest-$part.json"
        done
        python3 .github/scripts/ci15-assert-realtime.py \
          "$RUNNER_TEMP/nextest-rest-tests.json" \
          "$RUNNER_TEMP/nextest-rest-1.json" \
          "$RUNNER_TEMP/nextest-rest-2.json"
    - name: Candidate realtime inventory partition assertion
      if: matrix.shard == 'build-heavy' || matrix.shard == 'network'
      run: "cargo metadata --format-version 1 --all-features --locked > \"$RUNNER_TEMP/realtime-cargo.json\"\ncargo nextest\
        \ list --workspace --all-features --list-type binaries-only --message-format json > \"$RUNNER_TEMP/realtime-binaries.json\"\
        \nfor partition in whole build-heavy network; do\n  filter=\"$REALTIME_BINARIES\"\n  if [[ \"$partition\" == build-heavy\
        \ ]]; then filter=\"($REALTIME_BINARIES) and ($BUILD_HEAVY_BINARIES)\"; fi\n  if [[ \"$partition\" == network ]];\
        \ then filter=\"($REALTIME_BINARIES) and !($BUILD_HEAVY_BINARIES)\"; fi\n  cargo nextest list --cargo-metadata \"\
        $RUNNER_TEMP/realtime-cargo.json\" --binaries-metadata \"$RUNNER_TEMP/realtime-binaries.json\" -E \"$filter\" --message-format\
        \ json > \"$RUNNER_TEMP/realtime-$partition.json\"\ndone\npython3 .github/scripts/ci15-assert-realtime.py \"$RUNNER_TEMP/realtime-whole.json\"\
        \ \"$RUNNER_TEMP/realtime-build-heavy.json\" \"$RUNNER_TEMP/realtime-network.json\""
    - name: Run tests (nextest, ${{ matrix.shard }} shard)
      env:
        NEXTEST_SHARD: ${{ matrix.shard }}
      run: |
        case "$NEXTEST_SHARD" in
          realtime)
            cargo nextest run --workspace --all-features --no-fail-fast -E "$REALTIME_BINARIES"
            ;;
          build-heavy|network)
            filter="($REALTIME_BINARIES) and ($BUILD_HEAVY_BINARIES)"
            if [[ "$NEXTEST_SHARD" == network ]]; then
              filter="($REALTIME_BINARIES) and !($BUILD_HEAVY_BINARIES)"
            fi
            cargo nextest run \
              --cargo-metadata "$RUNNER_TEMP/realtime-cargo.json" \
              --binaries-metadata "$RUNNER_TEMP/realtime-binaries.json" \
              --no-fail-fast -E "$filter"
            ;;
          rest|rest-1|rest-2)
            partition=()
            if [[ "$NEXTEST_SHARD" != rest ]]; then
              partition=(--partition "hash:${NEXTEST_SHARD#rest-}/2")
            fi
            cargo nextest run \
              --cargo-metadata "$RUNNER_TEMP/nextest-rest-cargo.json" \
              --binaries-metadata "$RUNNER_TEMP/nextest-rest-binaries.json" \
              --no-fail-fast -E "!($REALTIME_BINARIES)" "${partition[@]}"
            ;;
          *)
            printf 'Unexpected nextest shard: %s\n' "$NEXTEST_SHARD" >&2
            exit 1
            ;;
        esac
    - name: Run doctests
      if: matrix.shard == 'rest' || matrix.shard == 'rest-1'
      run: cargo test --doc --workspace --all-features
    - name: sccache stats
      if: always()
      run: sccache --show-stats || true
    - name: Record observed cache outcomes
      if: always()
      env:
        CI15_CACHE_REPORT: '[{"step": "ci15-cache-5", "action": "Swatinem/rust-cache@v2", "hit": "${{ steps.ci15-cache-5.outputs.cache-hit
          }}", "outcome": "${{ steps.ci15-cache-5.outcome }}"}]'
      run: echo "$CI15_CACHE_REPORT"; echo "$CI15_CACHE_REPORT" >> "$GITHUB_STEP_SUMMARY"
    - name: Record final compiler cache statistics
      if: always()
      run: sccache --show-stats || true
