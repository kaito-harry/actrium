        \ \\\n  \"$tool_root/wasm-tools.tar.gz\" \\\n  \"$WASM_TOOLS_SHA256\"\nmkdir \"$tool_root/wasm-tools\"\ntar --extract\
        \ --gzip --file \"$tool_root/wasm-tools.tar.gz\" \\\n  --strip-components=1 --directory \"$tool_root/wasm-tools\"\n\
        \ndownload \\\n  https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-24/wasi-sdk-24.0-x86_64-linux.tar.gz\
        \ \\\n  \"$tool_root/wasi-sdk.tar.gz\" \\\n  \"$WASI_SDK_SHA256\"\nmkdir \"$tool_root/wasi-sdk\"\ntar --extract --gzip\
        \ --file \"$tool_root/wasi-sdk.tar.gz\" \\\n  --strip-components=1 --directory \"$tool_root/wasi-sdk\"\n\ndownload\
        \ \\\n  https://github.com/bytecodealliance/wasmtime/releases/download/v46.0.1/wasi_snapshot_preview1.reactor.wasm\
        \ \\\n  \"$tool_root/wasi_snapshot_preview1.reactor.wasm\" \\\n  \"$WASI_ADAPTER_SHA256\"\n\n{\n  echo \"WIT_BINDGEN=$tool_root/wit-bindgen/wit-bindgen\"\
        \n  echo \"WASM_TOOLS=$tool_root/wasm-tools/wasm-tools\"\n  echo \"WASI_SDK=$tool_root/wasi-sdk\"\n  echo \"WASI_ADAPTER=$tool_root/wasi_snapshot_preview1.reactor.wasm\"\
