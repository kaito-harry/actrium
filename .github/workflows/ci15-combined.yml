    - name: Type-check actr-cabi Swift wrapper
      run: swiftc -typecheck -swift-version 6 -I packages/actr-cabi/swift/Sources/ActrCabi/include packages/actr-cabi/swift/Sources/ActrCabi/ActrCabi.swift
    - name: Build local Swift XCFramework
