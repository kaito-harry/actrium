name: CI15 Combined Full Gate Experiment
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  identity:
    name: Commit Identity Privacy
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: 0
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Test identity policy
      run: python .github/scripts/check_commit_identities_test.py
    - name: Check newly introduced commits
      env:
        BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      run: python .github/scripts/check_commit_identities.py --base-sha "$BASE_SHA" --head-sha "$HEAD_SHA"
  determine:
    name: Determine Affected Targets
    runs-on: ubuntu-24.04
    outputs:
      mode: ${{ steps.targets.outputs.mode }}
      changed_files_json: ${{ steps.targets.outputs.changed_files_json }}
      reasons_json: ${{ steps.targets.outputs.reasons_json }}
      rust_core: ${{ steps.targets.outputs.rust_core }}
      ts_binding: ${{ steps.targets.outputs.ts_binding }}
      ts_workload: ${{ steps.targets.outputs.ts_workload }}
      python_codegen: ${{ steps.targets.outputs.python_codegen }}
      python_workload: ${{ steps.targets.outputs.python_workload }}
      swift_binding: ${{ steps.targets.outputs.swift_binding }}
      kotlin_binding: ${{ steps.targets.outputs.kotlin_binding }}
      csharp_binding: ${{ steps.targets.outputs.csharp_binding }}
      web_binding: ${{ steps.targets.outputs.web_binding }}
      c_go_workloads: ${{ steps.targets.outputs.c_go_workloads }}
      e2e_rust: ${{ steps.targets.outputs.e2e_rust }}
      e2e_package_runtime: ${{ steps.targets.outputs.e2e_package_runtime }}
      release_related: ${{ steps.targets.outputs.release_related }}
    steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: 0
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Install SQLite CLI
      run: "if ! command -v sqlite3 >/dev/null 2>&1; then\n  sudo apt-get update\n  sudo apt-get install -y sqlite3\nfi\n"
    - name: Test SDK error message generation
      run: python3 scripts/actr/tests/test_patch_error_messages.py
    - name: Test mobile credential packaging gate
      run: python3 scripts/actr/tests/test_check_mobile_assets.py
    - name: Validate GitHub-hosted runner policy
      run: 'python -m pip install --disable-pip-version-check -r .github/scripts/runner-policy-requirements.txt

        python .github/scripts/check_workflow_runners_test.py

        python .github/scripts/check_workflow_runners.py

        '
    - name: Test target detection
      run: python .github/scripts/ci_targets_test.py
    - name: Test CI configuration
      run: python .github/scripts/ci_gate_test.py
    - name: Test repository language policy
      run: python .github/scripts/check_cjk_test.py
    - id: targets
      name: Compute targets
      env:
        EVENT_NAME: workflow_dispatch
        BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        MANUAL_FULL: 'true'
      run: "python .github/scripts/ci_targets.py \\\n  --event-name \"$EVENT_NAME\" \\\n  --base-sha \"$BASE_SHA\" \\\n  --head-sha\
        \ \"$HEAD_SHA\" \\\n  --manual-full \"$MANUAL_FULL\"\n"
    - name: Test experiment guard and partition assertions
      run: python3 .github/scripts/ci15-combined-test.py
    - name: Verify experiment variant and unchanged product source
      env:
        BASELINE_SOURCE: 9cf6a9e37eb7e51b879d3ceb39a2bf01af19dec9
      run: "case \"$GITHUB_REF_NAME\" in\n  experiment/ci15-combined-baseline-*|experiment/ci15-combined-candidate-*) ;;\n\
        \  *) echo 'Invalid experiment variant'; exit 1;;\nesac\ngit diff --exit-code \"$BASELINE_SOURCE\" HEAD -- . ':!.github'\
        \ ':!tools/ci'\necho \"source=$BASELINE_SOURCE variant=$GITHUB_REF_NAME cache=$CI15_CACHE\" >> \"$GITHUB_STEP_SUMMARY\""
  cli_web_assets:
    name: Prepare CLI Web Runtime
    needs: determine
    if: needs.determine.outputs.rust_core == 'true' || needs.determine.outputs.e2e_package_runtime == 'true' || needs.determine.outputs.web_binding
      == 'true' || needs.determine.outputs.kotlin_binding == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    env:
      RUSTUP_TOOLCHAIN: 1.99.1
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: 'true'
    steps:
    - uses: actions/checkout@v5
    - name: Cache CLI web runtime assets
      id: cli-web-assets
      uses: actions/cache@v4
      with:
        path: packages/actr-web/dist/sw
        key: "${{ env.CI15_CACHE }}-cli-web-runtime-v5-rust1.99.1-wp0.15.0-pc${{ vars.PROTOC_VERSION || '29.3' }}-${{ hashFiles(\n\
          \  'Cargo.toml', 'Cargo.lock', 'rust-toolchain*', '.cargo/config.toml',\n  'packages/actr-web/Cargo.toml', 'packages/actr-web/Cargo.lock',\n\
          \  'packages/actr-web/.cargo/config.toml', 'packages/actr-web/rust-toolchain*',\n  'packages/actr-web/packages/**',\
          \ 'packages/actr-web/crates/**',\n  'packages/actr-web/scripts/**', 'tools/ci/wasm-bindgen/**', 'crates/actr-protocol/**',\n\
          \  'crates/actr-framework/**', 'crates/actr-platform-traits/**',\n  'crates/actr-pack/**', 'crates/actr-runtime-mailbox/**',\n\
          \  'crates/actr-relay-security/**') }}"
    - name: Check cached Web runtime
      id: web-runtime
      env:
        CACHE_HIT: ${{ steps.cli-web-assets.outputs.cache-hit }}
      run: "dist=packages/actr-web/dist/sw\nready=false\nif [[ \"$CACHE_HIT\" == true && -s \"$dist/actr_sw_host_bg.wasm\"\
        \ &&\n      -s \"$dist/actr_sw_host.js\" && -s \"$dist/actr_sw_host.d.ts\" &&\n      -s \"$dist/package.json\" ]];\
        \ then\n  ready=true\nfi\necho \"ready=$ready\" >> \"$GITHUB_OUTPUT\"\n"
    - name: Prepare Linux build space
      if: (steps.web-runtime.outputs.ready != 'true') && (!contains(github.ref_name, 'ci15-combined-candidate-'))
      uses: ./.github/actions/prepare-linux-build
    - name: Candidate Web space guard
      uses: ./.github/actions/ci15-web-space
      if: (steps.web-runtime.outputs.ready != 'true') && (contains(github.ref_name, 'ci15-combined-candidate-'))
    - name: Setup Rust
      if: steps.web-runtime.outputs.ready != 'true'
      uses: dtolnay/rust-toolchain@1.99.1
      with:
        targets: wasm32-unknown-unknown
    - name: Install protoc
      if: steps.web-runtime.outputs.ready != 'true'
      uses: arduino/setup-protoc@v3
      with:
        repo-token: ${{ github.token }}
        version: ${{ vars.PROTOC_VERSION || '29.3' }}
    - name: Run sccache-cache
      if: steps.web-runtime.outputs.ready != 'true'
      uses: mozilla-actions/sccache-action@v0.0.9
      with:
        version: v0.18.0
    - name: Cache cold web-build dependencies
      if: steps.web-runtime.outputs.ready != 'true'
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: packages/actr-web -> ../../target/bindings-web
        cache-bin: false
        shared-key: cli-web-assets
        prefix-key: ${{ env.CI15_CACHE }}-rust
      id: ci15-cache-8
    - name: Candidate shared prebuilt Wasm tools
      uses: ./.github/actions/install-wasm-tools
      if: (steps.web-runtime.outputs.ready != 'true') && (contains(github.ref_name, 'ci15-combined-candidate-'))
      with:
        wasm-pack-only: 'true'
    - name: Install wasm-pack
      if: (steps.web-runtime.outputs.ready != 'true') && (!contains(github.ref_name, 'ci15-combined-candidate-'))
      run: "if ! wasm-pack --version 2>/dev/null | grep -Fxq \"wasm-pack 0.15.0\"; then\n  cargo install wasm-pack --version\
        \ 0.15.0 --locked --force\nfi\nwasm-pack --version 2>/dev/null | grep -Fxq \"wasm-pack 0.15.0\"\n"
    - name: Build CLI web runtime assets
      if: steps.web-runtime.outputs.ready != 'true'
      run: bash packages/actr-web/scripts/sync-cli-assets.sh --build
    - name: Sync cached CLI web runtime assets
      if: steps.web-runtime.outputs.ready == 'true'
      run: bash packages/actr-web/scripts/sync-cli-assets.sh
    - name: Verify Web runtime before uploading
      run: "for file in actr_sw_host_bg.wasm actr_sw_host.js actr_sw_host.d.ts package.json; do\n  test -s \"packages/actr-web/dist/sw/$file\"\
        \ || { echo \"Missing Web runtime output: $file\" >&2; exit 1; }\ndone\nbash packages/actr-web/scripts/sync-cli-assets.sh\
        \ --check\n"
    - name: Upload CLI web runtime assets
      uses: actions/upload-artifact@v4
      with:
        name: cli-web-runtime
        path: 'crates/actr-cli/assets/web-runtime/actr_sw_host_bg.wasm

          crates/actr-cli/assets/web-runtime/actr_sw_host.js

          '
        if-no-files-found: error
        retention-days: 1
    - name: Upload sw-host runtime assets
      uses: actions/upload-artifact@v4
      with:
        name: sw-host-runtime
        path: packages/actr-web/dist/sw/
        if-no-files-found: error
        retention-days: 1
    - name: Record observed cache outcomes
      if: always()
      env:
        CI15_CACHE_REPORT: '[{"step": "cli-web-assets", "action": "actions/cache@v4", "hit": "${{ steps.cli-web-assets.outputs.cache-hit
          }}", "outcome": "${{ steps.cli-web-assets.outcome }}"}, {"step": "ci15-cache-8", "action": "Swatinem/rust-cache@v2",
          "hit": "${{ steps.ci15-cache-8.outputs.cache-hit }}", "outcome": "${{ steps.ci15-cache-8.outcome }}"}]'
      run: echo "$CI15_CACHE_REPORT"; echo "$CI15_CACHE_REPORT" >> "$GITHUB_STEP_SUMMARY"
    - name: Record final compiler cache statistics
      if: always()
      run: sccache --show-stats || true
  e2e_rust:
    name: Rust E2E Compile
    needs: determine
    if: needs.determine.outputs.e2e_rust == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v5
    - name: Prepare Linux build space
      uses: ./.github/actions/prepare-linux-build
    - name: Setup Rust
      uses: dtolnay/rust-toolchain@1.99.1
      with:
        targets: wasm32-wasip2,wasm32-unknown-unknown
    - name: Install protoc
      uses: arduino/setup-protoc@v3
      with:
        repo-token: ${{ github.token }}
        version: ${{ vars.PROTOC_VERSION || '29.3' }}
    - uses: Swatinem/rust-cache@v2
      with:
        workspaces: tests/e2e/actr -> ../target/e2e
        prefix-key: ${{ env.CI15_CACHE }}-rust
      id: ci15-cache-4
    - name: Install native dependencies
      run: 'sudo apt-get update

        sudo apt-get install -y libopus-dev

        '
    - name: Resolve e2e workspace with the committed lockfile
      working-directory: tests/e2e/actr
      run: "cargo metadata \\\n  --format-version 1 \\\n  --locked \\\n  > \"$RUNNER_TEMP/e2e-metadata.json\"\npython3 - \"\
        $RUNNER_TEMP/e2e-metadata.json\" <<'PY'\nimport json\nimport pathlib\nimport sys\n\nmetadata = json.loads(pathlib.Path(sys.argv[1]).read_text())\n\
        registry_actr = [\n    package[\"name\"]\n    for package in metadata[\"packages\"]\n    if package[\"name\"].startswith(\"\
        actr\") and package[\"source\"] is not None\n]\nif registry_actr:\n    raise SystemExit(\n        \"e2e actr dependencies\
        \ must resolve from local paths: \"\n        + \", \".join(sorted(registry_actr))\n    )\nPY\n"
    - name: Compile the Rust E2E workspace
      working-directory: tests/e2e/actr
      run: cargo check --workspace --locked
    - name: Record observed cache outcomes
      if: always()
      env:
        CI15_CACHE_REPORT: '[{"step": "ci15-cache-4", "action": "Swatinem/rust-cache@v2", "hit": "${{ steps.ci15-cache-4.outputs.cache-hit
          }}", "outcome": "${{ steps.ci15-cache-4.outcome }}"}]'
      run: echo "$CI15_CACHE_REPORT"; echo "$CI15_CACHE_REPORT" >> "$GITHUB_STEP_SUMMARY"
  e2e_package_runtime:
    name: E2E Package Runtime
    needs:
    - determine
    - cli_web_assets
    if: needs.determine.outputs.e2e_package_runtime == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      ACTR_TARGET_DIR: ${{ github.workspace }}/target/e2e-cache/package-runtime-echo/native
      LORAN_TARGET_DIR: ${{ github.workspace }}/target/e2e-cache/package-runtime-echo/native
      WORKSPACE_TARGET_DIR: ${{ github.workspace }}/target/e2e-cache/package-runtime-echo/native
    steps:
    - uses: actions/checkout@v5
    - name: Prepare Linux build space with native-build threshold
      uses: ./.github/actions/ci15-web-space
      with:
        minimum-free-gib: '64'
    - name: Setup Rust
      uses: dtolnay/rust-toolchain@1.99.1
      with:
        targets: wasm32-unknown-unknown
    - name: Install Linux e2e dependencies
      run: 'sudo rm -f /etc/apt/sources.list.d/google-chrome*

        sudo apt-get update

        sudo apt-get install -y jq sqlite3 lsof perl bubblewrap openssl

        '
    - name: Install protoc
      uses: arduino/setup-protoc@v3
      with:
        repo-token: ${{ secrets.GITHUB_TOKEN }}
        version: ${{ vars.PROTOC_VERSION || '29.3' }}
    - name: Candidate shared prebuilt Wasm tools
      uses: ./.github/actions/install-wasm-tools
      if: contains(github.ref_name, 'ci15-combined-candidate-')
      with:
        wasm-pack-only: 'true'
    - name: Install wasm-pack
      run: "if ! wasm-pack --version 2>/dev/null | grep -Fxq \"wasm-pack 0.15.0\"; then\n  cargo install wasm-pack --version\
        \ 0.15.0 --locked --force\nfi\nwasm-pack --version 2>/dev/null | grep -Fxq \"wasm-pack 0.15.0\"\n"
      if: '!contains(github.ref_name, ''ci15-combined-candidate-'')'
    - uses: Swatinem/rust-cache@v2
      with:
        save-if: false
        prefix-key: ${{ env.CI15_CACHE }}-rust
      id: ci15-cache-7
    - name: Download CLI web runtime assets
      uses: actions/download-artifact@v4
      with:
        name: cli-web-runtime
        path: crates/actr-cli/assets/web-runtime
    - name: Sync CLI source assets
      run: 'test -s crates/actr-cli/assets/web-runtime/actr_sw_host_bg.wasm

        test -s crates/actr-cli/assets/web-runtime/actr_sw_host.js

        bash packages/actr-web/scripts/sync-cli-assets.sh --skip-sw-host

        '
    - name: Verify Publisher signing-key isolation
      run: python3 tests/e2e/actr/package-runtime-echo/test_runtime_isolation.py
    - name: Verify HTTPS transport and certificate rejection
      run: python3 tests/e2e/actr/package-runtime-echo/test_https_documents.py
    - name: Build the Loran fixture once for this checkout
      run: |
        CARGO_TARGET_DIR="$LORAN_TARGET_DIR" cargo test --no-run --message-format=json \
          --manifest-path crates/loran-server/Cargo.toml --bin loran \
          > "$RUNNER_TEMP/ci15-loran-fixture.jsonl"
        fixture=$(jq -r '
          select(.reason == "compiler-artifact" and .target.name == "loran"
            and .profile.test == true and .executable != null) | .executable
        ' "$RUNNER_TEMP/ci15-loran-fixture.jsonl" | tail -1)
        test -x "$fixture"
        "$fixture" --list | grep -Fx 'package_runtime_fixture: test'
        printf 'LORAN_BIN=%s\n' "$fixture" >> "$GITHUB_ENV"
    - name: Run signed package runtime echo e2e
      run: bash tests/e2e/actr/package-runtime-echo/run.sh
    - name: Run provider and external domain Realms
      run: bash tests/e2e/actr/package-runtime-echo/realm-matrix.sh
    - name: Verify retired and revoked Publisher signing keys
      run: MODE=rotation bash tests/e2e/actr/package-runtime-echo/run.sh
    - name: Record observed cache outcomes
      if: always()
      env:
        CI15_CACHE_REPORT: '[{"step": "ci15-cache-7", "action": "Swatinem/rust-cache@v2", "hit": "${{ steps.ci15-cache-7.outputs.cache-hit
          }}", "outcome": "${{ steps.ci15-cache-7.outcome }}"}]'
      run: echo "$CI15_CACHE_REPORT"; echo "$CI15_CACHE_REPORT" >> "$GITHUB_STEP_SUMMARY"
  audit:
    name: Dependency Audit
    needs: determine
    if: needs.determine.outputs.rust_core == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v5
    - name: Setup Rust
      uses: dtolnay/rust-toolchain@1.99.1
    - name: Install cargo-audit
      run: cargo install cargo-audit --version 0.22.2 --locked --force
    - name: Audit Cargo.lock
      run: cargo audit
  rust:
    name: Rust
    needs:
    - determine
    - cli_web_assets
    if: needs.determine.outputs.rust_core == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    env:
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: 1
      RUSTUP_TOOLCHAIN: 1.99.1
      ACTR_REQUIRE_WASM_FIXTURE: '1'
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: 'true'
    steps:
    - uses: actions/checkout@v5
    - name: Prepare Linux build space with native-build threshold
      uses: ./.github/actions/ci15-web-space
      with:
        minimum-free-gib: '64'
    - name: Setup Rust
      uses: dtolnay/rust-toolchain@1.99.1
      with:
        components: rustfmt,clippy
        targets: wasm32-wasip2,wasm32-unknown-unknown
    - name: Install protoc
      uses: arduino/setup-protoc@v3
      with:
        repo-token: ${{ github.token }}
        version: ${{ vars.PROTOC_VERSION || '29.3' }}
    - name: Run sccache-cache
      uses: mozilla-actions/sccache-action@v0.0.9
      with:
        version: v0.18.0
    - name: OTel payload-logging guard
      run: bash .github/workflows/scripts/check-payload-logging.sh
    - name: Test mobile Issuer fixture on a non-Unix target
      run: python3 scripts/actr/tests/test_mobile_fixture_cfg.py
    - name: Install native build dependencies
      run: "if ! command -v pkg-config >/dev/null 2>&1 || ! pkg-config --exists openssl || ! command -v cmake >/dev/null 2>&1;\
        \ then\n  sudo apt-get update\n  sudo apt-get install -y pkg-config libssl-dev cmake\nfi\n"
    - name: Verify actr-hyper WIT drift
      run: 'cmp crates/actr-framework/wit-v2/actr-workload.wit crates/actr-hyper/wit-v2/actr-workload.wit

        '
    - name: Cache cargo-installed tools
      id: cargo-tools
      uses: actions/cache@v4
      with:
        path: '~/.cargo/bin/wasm-pack

          ~/.cargo/bin/wasm-component-ld

          ~/.cargo/bin/wasm-tools

          '
        key: ${{ env.CI15_CACHE }}-cargo-tools-v2-${{ runner.os }}-wp0.15.0-wcld0.5.26-wt1.253.0
    - name: Candidate shared prebuilt Wasm tools
      uses: ./.github/actions/install-wasm-tools
      if: contains(github.ref_name, 'ci15-combined-candidate-')
    - name: Install wasm-pack
      run: "if ! wasm-pack --version 2>/dev/null | grep -Fxq \"wasm-pack 0.15.0\"; then\n  cargo install wasm-pack --version\
        \ 0.15.0 --locked --force\nfi\nwasm-pack --version 2>/dev/null | grep -Fxq \"wasm-pack 0.15.0\"\n"
      if: '!contains(github.ref_name, ''ci15-combined-candidate-'')'
    - name: Install wasm Component Model toolchain
      run: "if ! wasm-component-ld --version 2>/dev/null | grep -Fxq \"wasm-component-ld 0.5.26\"; then\n  cargo install wasm-component-ld\
        \ --version 0.5.26 --locked --force\nfi\nwasm-component-ld --version 2>/dev/null | grep -Fxq \"wasm-component-ld 0.5.26\"\
        \nif ! wasm-tools --version 2>/dev/null | grep -Eq '^wasm-tools 1\\.253\\.0( \\(.*\\))?$'; then\n  cargo install wasm-tools\
        \ --version 1.253.0 --locked --force\nfi\nwasm-tools --version 2>/dev/null | grep -Eq '^wasm-tools 1\\.253\\.0( \\\
        (.*\\))?$'\n"
      if: '!contains(github.ref_name, ''ci15-combined-candidate-'')'
    - name: Download CLI web runtime assets
      uses: actions/download-artifact@v4
      with:
        name: cli-web-runtime
        path: crates/actr-cli/assets/web-runtime
    - name: Sync CLI source assets
      run: 'test -s crates/actr-cli/assets/web-runtime/actr_sw_host_bg.wasm

        test -s crates/actr-cli/assets/web-runtime/actr_sw_host.js

        bash packages/actr-web/scripts/sync-cli-assets.sh --skip-sw-host

        '
    - name: Check formatting
      run: cargo fmt --all -- --check
    - name: Test Rust protoc plugin well-known types
      run: cargo test -p actr-framework-protoc-codegen --test well_known_type_smoke
    - name: Verify RFC-0400 timer inventory
      run: cargo test -p actr-hyper --lib timer::tests::inv24_production_timer_calls_and_inventory_do_not_drift
      if: '!contains(github.ref_name, ''ci15-combined-candidate-'')'
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Verify upstream dependency overrides
      run: 'python3 scripts/actr/check-upstream-patches.py

        python3 scripts/actr/tests/test_apply_upstream_patches.py

        '
    - name: Check committed Kotlin binding checksums against the native library
      run: "cargo build -p libactr\npython3 scripts/actr/check-binding-checksums.py \\\n  --library target/debug/libactr.so\
        \ \\\n  --binding packages/actr-kotlin/actr-kotlin/src/main/kotlin/io/actrium/actr/actr.kt\n"
    - name: Clippy (deny warnings)
      env:
        CARGO_BUILD_WARNINGS: deny
      run: cargo +1.99.1 clippy --workspace --all-targets --all-features
    - name: Record observed cache outcomes
      if: always()
      env:
        CI15_CACHE_REPORT: '[{"step": "cargo-tools", "action": "actions/cache@v4", "hit": "${{ steps.cargo-tools.outputs.cache-hit
          }}", "outcome": "${{ steps.cargo-tools.outcome }}"}]'
      run: echo "$CI15_CACHE_REPORT"; echo "$CI15_CACHE_REPORT" >> "$GITHUB_STEP_SUMMARY"
    - name: Record final compiler cache statistics
      if: always()
      run: sccache --show-stats || true
  test:
    name: Test (Rust, ${{ matrix.shard }})
    needs:
    - determine
    - cli_web_assets
    if: needs.determine.outputs.rust_core == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(contains(github.ref_name, 'ci15-combined-candidate-') && '["build-heavy","network","rest-1","rest-2"]' ||
