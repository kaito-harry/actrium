      if: '!contains(github.ref_name, ''ci15-combined-candidate-'')'
    - name: Clippy (WebRTC, deny warnings)
      env:
        CARGO_BUILD_WARNINGS: deny
      run: cargo +1.99.1 clippy -p actr-hyper --all-targets
    - name: Test (WebRTC)
      run: cargo nextest run -p actr-hyper -E 'test(/^wire::webrtc::rtc/)' --no-fail-fast
    - name: Record observed cache outcomes
      if: always()
      env:
        CI15_CACHE_REPORT: '[{"step": "ci15-cache-4", "action": "Swatinem/rust-cache@v2", "hit": "${{ steps.ci15-cache-4.outputs.cache-hit
          }}", "outcome": "${{ steps.ci15-cache-4.outcome }}"}]'
      run: echo "$CI15_CACHE_REPORT"; echo "$CI15_CACHE_REPORT" >> "$GITHUB_STEP_SUMMARY"
  cjk:
    name: Language Policy
    runs-on: ubuntu-24.04
    if: always()
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: 0
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Check default-language content and portable paths
      run: python .github/scripts/check_cjk.py
    - name: Reject retired package protocol identifiers
      run: 'python3 scripts/actrium/check_retired_protocol_names_test.py

        scripts/actrium/check-retired-protocol-names.sh

        '
  csharp:
    name: C#
    needs: determine
    if: needs.determine.outputs.csharp_binding == 'true'
    uses: ./.github/workflows/ci15-combined-csharp.yml
    with:
      experiment_namespace: ${{ github.ref_name }}
  gate:
    name: Gate
    runs-on: ubuntu-24.04
    if: always()
    needs:
    - identity
    - determine
    - cli_web_assets
    - e2e_rust
    - e2e_package_runtime
    - audit
    - rust
    - typescript
    - typescript_workload
    - python_codegen
    - python_workload
    - swift
    - kotlin
    - csharp
    - web
    - c_go_workloads
    - test
    - webrtc
    - cjk
    env:
      MODE: ${{ needs.determine.outputs.mode }}
      IDENTITY_RESULT: ${{ needs.identity.result }}
      CHANGED_FILES_JSON: ${{ needs.determine.outputs.changed_files_json }}
      REASONS_JSON: ${{ needs.determine.outputs.reasons_json }}
      RUST_RESULT: ${{ needs.rust.result }}
      AUDIT_RESULT: ${{ needs.audit.result }}
      TYPESCRIPT_RESULT: ${{ needs.typescript.result }}
      TYPESCRIPT_WORKLOAD_RESULT: ${{ needs.typescript_workload.result }}
      PYTHON_CODEGEN_RESULT: ${{ needs.python_codegen.result }}
      PYTHON_WORKLOAD_RESULT: ${{ needs.python_workload.result }}
      SWIFT_RESULT: ${{ needs.swift.result }}
      KOTLIN_RESULT: ${{ needs.kotlin.result }}
      CSHARP_RESULT: ${{ needs.csharp.result }}
      WEB_RESULT: ${{ needs.web.result }}
      C_GO_WORKLOADS_RESULT: ${{ needs.c_go_workloads.result }}
      CLI_WEB_ASSETS_RESULT: ${{ needs.cli_web_assets.result }}
      E2E_RUST_RESULT: ${{ needs.e2e_rust.result }}
      E2E_PACKAGE_RUNTIME_RESULT: ${{ needs.e2e_package_runtime.result }}
      TEST_RESULT: ${{ needs.test.result }}
      WEBRTC_RESULT: ${{ needs.webrtc.result }}
      CJK_RESULT: ${{ needs.cjk.result }}
    steps:
    - name: Summarize gate
      run: "python3 - <<'PY'\nimport json\nimport os\nimport sys\n\nresults = {\n    \"identity\": os.environ[\"IDENTITY_RESULT\"\
        ],\n    \"audit\": os.environ[\"AUDIT_RESULT\"],\n    \"rust\": os.environ[\"RUST_RESULT\"],\n    \"typescript\":\
        \ os.environ[\"TYPESCRIPT_RESULT\"],\n    \"typescript_workload\": os.environ[\"TYPESCRIPT_WORKLOAD_RESULT\"],\n \
        \   \"python_codegen\": os.environ[\"PYTHON_CODEGEN_RESULT\"],\n    \"python_workload\": os.environ[\"PYTHON_WORKLOAD_RESULT\"\
        ],\n    \"swift\": os.environ[\"SWIFT_RESULT\"],\n    \"kotlin\": os.environ[\"KOTLIN_RESULT\"],\n    \"csharp\":\
        \ os.environ[\"CSHARP_RESULT\"],\n    \"web\": os.environ[\"WEB_RESULT\"],\n    \"c_go_workloads\": os.environ[\"\
        C_GO_WORKLOADS_RESULT\"],\n    \"cli_web_assets\": os.environ[\"CLI_WEB_ASSETS_RESULT\"],\n    \"e2e_rust\": os.environ[\"\
        E2E_RUST_RESULT\"],\n    \"e2e_package_runtime\": os.environ[\"E2E_PACKAGE_RUNTIME_RESULT\"],\n    \"test\": os.environ[\"\
        TEST_RESULT\"],\n    \"webrtc\": os.environ[\"WEBRTC_RESULT\"],\n    \"cjk\": os.environ[\"CJK_RESULT\"],\n}\n\nchanged_files\
        \ = json.loads(os.environ[\"CHANGED_FILES_JSON\"])\nreasons = json.loads(os.environ[\"REASONS_JSON\"])\nmode = os.environ[\"\
        MODE\"]\n\nsummary_lines = [\n    \"## CI Gate\",\n    \"\",\n    f\"- Mode: `{mode}`\",\n    f\"- Changed files:\
        \ `{len(changed_files)}`\",\n    \"\",\n    \"### Domain Results\",\n]\nsummary_lines.extend([f\"- `{name}`: `{result}`\"\
        \ for name, result in results.items()])\n\nif reasons:\n    summary_lines.append(\"\")\n    summary_lines.append(\"\
        ### Trigger Reasons\")\n    summary_lines.extend([f\"- `{reason}`\" for reason in reasons])\n\nif changed_files:\n\
        \    summary_lines.append(\"\")\n    summary_lines.append(\"### Changed Files\")\n    summary_lines.extend([f\"- `{path}`\"\
        \ for path in changed_files])\n\nif os.environ.get(\"GITHUB_STEP_SUMMARY\"):\n    with open(os.environ[\"GITHUB_STEP_SUMMARY\"\
        ], \"a\", encoding=\"utf-8\") as fh:\n        fh.write(\"\\n\".join(summary_lines) + \"\\n\")\n\nfailed = [name for\
        \ name, result in results.items() if result not in {\"success\", \"skipped\"}]\nif failed:\n    print(f\"CI gate failed\
        \ because these domains did not pass: {', '.join(failed)}\", file=sys.stderr)\n    sys.exit(1)\nPY\n"
  complete:
    name: All workflow jobs including MSRV
    if: always()
    needs:
    - identity
    - determine
    - cli_web_assets
    - e2e_rust
    - e2e_package_runtime
    - audit
    - rust
    - test
    - rust_msrv
    - typescript
    - typescript_workload
    - python_codegen
    - python_workload
    - swift
    - kotlin
    - web
    - c_go_workloads
    - webrtc
    - cjk
    - csharp
    - gate
    runs-on: ubuntu-24.04
    env:
      RESULTS: ${{ toJSON(needs) }}
    steps:
    - name: Record every result independently of Gate
      run: "python3 - <<'PYCODE'\nimport json,os,sys\nresults=json.loads(os.environ['RESULTS'])\nwith open(os.environ['GITHUB_STEP_SUMMARY'],'a')\
        \ as f:\n    for name,value in results.items(): f.write(f\"- {name}: {value['result']}\\n\")\nif any(v['result'] !=\
        \ 'success' for v in results.values()): sys.exit(1)\nPYCODE"
'on':
  push:
    branches:
    - experiment/ci15-combined-*
defaults:
  run:
    shell: bash
env:
  CI15_CACHE: ${{ github.ref_name }}
  SCCACHE_GHA_VERSION: ${{ github.ref_name }}
