name: CI (Python)

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-python-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workload:
    name: Python Workload Authoring Check
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Prepare Linux build space
        uses: ./.github/actions/prepare-linux-build
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.99.0
        with:
          targets: wasm32-wasip2,wasm32-unknown-unknown
      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ github.token }}
          version: ${{ vars.PROTOC_VERSION || '29.3' }}
      - uses: Swatinem/rust-cache@v2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: packages/actr-python/actr-workload/pyproject.toml

      - name: Install wasm-tools
        run: |
          if ! wasm-tools --version 2>/dev/null | grep -Eq '^wasm-tools 1\.253\.0( \(.*\))?$'; then
            cargo install wasm-tools --version 1.253.0 --locked --force
          fi
          wasm-tools --version 2>/dev/null | grep -Eq '^wasm-tools 1\.253\.0( \(.*\))?$'

      - name: Install wasm-pack
        run: |
          if ! wasm-pack --version 2>/dev/null | grep -Fxq "wasm-pack 0.15.0"; then
            cargo install wasm-pack --version 0.15.0 --locked --force
          fi
          wasm-pack --version 2>/dev/null | grep -Fxq "wasm-pack 0.15.0"

      - name: Verify TypeScript workload WIT drift
        run: |
          cmp crates/actr-framework/wit-v2/actr-workload.wit packages/actr-typescript/actr-workload/src/wit-v2/actr-workload.wit

      - name: Build actr-workload package
        run: |
          python -m pip install -U build
          python -m build packages/actr-python/actr-workload

      - name: Install actr-workload build extra
        run: python -m pip install -e 'packages/actr-python/actr-workload[build]'

      - name: Verify componentize-py pin
        run: componentize-py --version | grep 'componentize-py 0.25.0'

      - name: Generate workload bindings
        run: |
          rm -rf /tmp/actr-workload-bindings
          actr-workload bindings /tmp/actr-workload-bindings
          test -f /tmp/actr-workload-bindings/actr_workload_bindings/exports/workload.py
          test -f /tmp/actr-workload-bindings/actr_workload_bindings/imports/host.py

      - name: Compile Python sources
        run: python -m compileall packages/actr-python/actr-workload/src examples/actr/python/echo-workload/workload.py examples/actr/python/concurrency-probe-workload/workload.py

      - name: Build Python echo workload
        working-directory: examples/actr/python/echo-workload
        run: ./build.sh package
