# Windows client verification.
#
# Scope: the Windows client only (windows) plus the Rust core it links
# against (crates/actrium-core). Sibling platform workflows (macos-verify.yml,
# android-verify.yml, ...) should follow the same <platform>-verify.yml
# naming when they land; this file deliberately does not try to cover them.
#
# Two jobs, both on windows-latest:
#   verify  - layout contract, actrium_core.dll build, the full rg-based +
#             P/Invoke test harness (scripts/actrium/verify-windows.sh, zero-warning
#             gate), and a Release build of the app.
#   package - the portable zip via scripts/actrium/package-windows.ps1 -SkipInstaller
#             (no Inno Setup, no WebView2 bootstrapper download, so the job
#             is deterministic and network-independent beyond registries),
#             reusing the verified DLL and uploaded as a run artifact.
#
# The DLL is built once with Rust 1.99.0. Both jobs use the same checked-out
# commit; packaging downloads the bytes exercised by the verification harness.

name: Windows Verify

on:
  push:
    branches: [main, master, develop]
    paths:
      - "windows/**"
      - "crates/actrium-core/**"
      - "scripts/actrium/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/workflows/actrium-windows.yml"
  pull_request:
    paths:
      - "windows/**"
      - "crates/actrium-core/**"
      - "scripts/actrium/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/workflows/actrium-windows.yml"
  workflow_dispatch:

concurrency:
  group: windows-verify-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1

jobs:
  verify:
    name: Harness and app build
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      # The contract scripts and the harness prologue are rg-based; ripgrep
      # is not preinstalled on the windows-latest image.
      - name: Install ripgrep
        run: choco install ripgrep --no-progress --yes

      - name: Check Windows packaging layout contract
        shell: bash
        run: bash scripts/actrium/check-windows-layout.sh

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.99.0

      - name: Setup protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          version: ${{ vars.PROTOC_VERSION || '29.3' }}

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows-verify

      - name: Build actrium_core.dll
        run: cargo build --release -p actrium-core

      # Both csprojs copy windows/native/*.dll into their output;
      # the harness makes real P/Invoke calls into actrium_core, so the DLL
      # must be staged before any dotnet step.
      - name: Stage actrium_core.dll for the app and tests
        shell: bash
        run: cp target/release/actrium_core.dll windows/native/

      - name: Setup .NET SDK 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      # Runs the full contract-grep + build + 162-case harness with the
      # zero-warning gate, exactly as on a developer Windows host.
      - name: Run Windows verification harness
        shell: bash
        run: bash scripts/actrium/verify-windows.sh

      - name: Build app (Release)
        run: dotnet build windows/Actrium.Windows.csproj --configuration Release -p:NuGetAudit=false

      - name: Upload verified actrium_core.dll
        uses: actions/upload-artifact@v4
        with:
          name: actrium-core-windows-${{ github.sha }}
          path: windows/native/actrium_core.dll
          if-no-files-found: error
          retention-days: 1

  package:
    name: Portable zip
    runs-on: windows-latest
    needs: verify
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      # The producer built this exact commit/profile and exercised its DLL
      # through the real P/Invoke harness. Keep packaging on the tested bytes.
      - name: Download verified actrium_core.dll
        uses: actions/download-artifact@v4
        with:
          name: actrium-core-windows-${{ github.sha }}
          path: windows/native

      - name: Setup .NET SDK 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Package portable zip
        shell: pwsh
        run: ./scripts/actrium/package-windows.ps1 -SkipInstaller

      - name: Verify packaged DLL matches the tested artifact
        shell: pwsh
        run: |
          $expected = (Get-FileHash windows/native/actrium_core.dll -Algorithm SHA256).Hash
          $zips = @(Get-ChildItem dist/windows/*.zip -File -ErrorAction Stop)
          if ($zips.Count -eq 0) { throw 'No portable zip was produced for DLL verification' }
          foreach ($zip in $zips) {
            $archive = [System.IO.Compression.ZipFile]::OpenRead($zip.FullName)
            try {
              $entry = $archive.GetEntry('actrium_core.dll')
              if ($null -eq $entry) { throw 'Portable zip is missing actrium_core.dll' }
              $stream = $entry.Open()
              $hasher = [System.Security.Cryptography.SHA256]::Create()
              try {
                $actual = [System.BitConverter]::ToString($hasher.ComputeHash($stream)).Replace('-', '')
                if ($actual -ne $expected) { throw 'Packaged DLL differs from the tested artifact' }
              } finally {
                $hasher.Dispose()
                $stream.Dispose()
              }
            } finally {
              $archive.Dispose()
            }
          }

      - name: Upload portable zip
        uses: actions/upload-artifact@v4
        with:
          name: actrium-windows-portable-zip
          path: dist/windows/*.zip
          if-no-files-found: error
