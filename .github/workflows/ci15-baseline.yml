    - name: crates/actr-cli/assets sync drift gate
      run: bash packages/actr-web/scripts/sync-cli-assets.sh --check --skip-sw-host
    - name: Run web-sdk unit tests (vitest)
      working-directory: packages/actr-web
      env:
