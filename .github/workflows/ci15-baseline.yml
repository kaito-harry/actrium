name: CI15 baseline
'on':
  push:
    branches:
    - experiment/ci15-baseline-20261112
permissions:
  contents: read
concurrency:
  group: ci15-baseline-${{ github.ref }}
  cancel-in-progress: false
jobs:
  identity:
    name: Commit Identity Privacy
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: 0
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Test identity policy
      run: python .github/scripts/check_commit_identities_test.py
    - name: Check newly introduced commits
      env:
        BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      run: python .github/scripts/check_commit_identities.py --base-sha "$BASE_SHA" --head-sha "$HEAD_SHA"
    - name: Disk usage at end
      if: always()
      run: df -h /; du -sh target 2>/dev/null || true
    env:
      SCCACHE_GHA_VERSION: ci15-20261112-v1-baseline
  determine:
    name: Determine Affected Targets
    runs-on: ubuntu-24.04
    outputs:
      mode: ${{ steps.targets.outputs.mode }}
      changed_files_json: ${{ steps.targets.outputs.changed_files_json }}
      reasons_json: ${{ steps.targets.outputs.reasons_json }}
      rust_core: ${{ steps.targets.outputs.rust_core }}
      ts_binding: ${{ steps.targets.outputs.ts_binding }}
      ts_workload: ${{ steps.targets.outputs.ts_workload }}
      python_codegen: ${{ steps.targets.outputs.python_codegen }}
      python_workload: ${{ steps.targets.outputs.python_workload }}
      swift_binding: ${{ steps.targets.outputs.swift_binding }}
      kotlin_binding: ${{ steps.targets.outputs.kotlin_binding }}
      csharp_binding: ${{ steps.targets.outputs.csharp_binding }}
      web_binding: ${{ steps.targets.outputs.web_binding }}
      c_go_workloads: ${{ steps.targets.outputs.c_go_workloads }}
      e2e_rust: ${{ steps.targets.outputs.e2e_rust }}
      e2e_package_runtime: ${{ steps.targets.outputs.e2e_package_runtime }}
      release_related: ${{ steps.targets.outputs.release_related }}
    steps:
    - uses: actions/checkout@v5
    - id: targets
      name: Fixed Rust PR domain set
      run: |-
        python3 - <<'PYX'
        import os,json
        keys=['rust_core','e2e_rust','e2e_package_runtime','ts_binding','swift_binding','csharp_binding','web_binding','release_related']
        with open(os.environ['GITHUB_OUTPUT'],'a') as f:
            f.write('mode=ci15-rust-core-plus-package-e2e\nchanged_files_json=[]\nreasons_json=["controlled CI experiment"]\n')
            for key in keys: f.write(key+'=true\n')
        PYX
    - name: Disk usage at end
      if: always()
      run: df -h /; du -sh target 2>/dev/null || true
    env:
      SCCACHE_GHA_VERSION: ci15-20261112-v1-baseline
  cli_web_assets:
    name: Prepare CLI Web Runtime
    needs: determine
    if: needs.determine.outputs.rust_core == 'true' || needs.determine.outputs.e2e_package_runtime == 'true' || needs.determine.outputs.web_binding == 'true' || needs.determine.outputs.kotlin_binding == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    env:
      RUSTUP_TOOLCHAIN: 1.99.0
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: 'true'
      SCCACHE_GHA_VERSION: ci15-20261112-v1-baseline
    steps:
    - uses: actions/checkout@v5
    - name: Cache CLI web runtime assets
      id: cli-web-assets
      uses: actions/cache@v4
      with:
        path: packages/actr-web/dist/sw
        key: |-
          ci15-20261112-v1-baseline-cli-web-runtime-v5-rust1.99.0-wp0.15.0-pc${{ vars.PROTOC_VERSION || '29.3' }}-${{ hashFiles(
            'Cargo.toml', 'Cargo.lock', 'rust-toolchain*', '.cargo/config.toml',
            'packages/actr-web/Cargo.toml', 'packages/actr-web/Cargo.lock',
            'packages/actr-web/.cargo/config.toml', 'packages/actr-web/rust-toolchain*',
            'packages/actr-web/packages/**', 'packages/actr-web/crates/**',
            'packages/actr-web/scripts/**', 'tools/ci/wasm-bindgen/**', 'crates/actr-protocol/**',
            'crates/actr-framework/**', 'crates/actr-platform-traits/**',
            'crates/actr-pack/**', 'crates/actr-runtime-mailbox/**',
            'crates/actr-relay-security/**') }}
    - name: Check cached Web runtime
      id: web-runtime
      env:
        CACHE_HIT: ${{ steps.cli-web-assets.outputs.cache-hit }}
      run: |
        dist=packages/actr-web/dist/sw
        ready=false
        if [[ "$CACHE_HIT" == true && -s "$dist/actr_sw_host_bg.wasm" &&
              -s "$dist/actr_sw_host.js" && -s "$dist/actr_sw_host.d.ts" &&
              -s "$dist/package.json" ]]; then
          ready=true
        fi
        echo "ready=$ready" >> "$GITHUB_OUTPUT"
    - name: Prepare Linux build space
      if: steps.web-runtime.outputs.ready != 'true'
      uses: ./.github/actions/prepare-linux-build
    - name: Setup Rust
      if: steps.web-runtime.outputs.ready != 'true'
      uses: dtolnay/rust-toolchain@1.99.0
      with:
        targets: wasm32-unknown-unknown
    - name: Install protoc
      if: steps.web-runtime.outputs.ready != 'true'
      uses: arduino/setup-protoc@v3
      with:
        repo-token: ${{ github.token }}
        version: ${{ vars.PROTOC_VERSION || '29.3' }}
    - name: Run sccache-cache
      if: steps.web-runtime.outputs.ready != 'true'
      uses: mozilla-actions/sccache-action@v0.0.9
      with:
        version: v0.18.0
    - name: Cache cold web-build dependencies
      if: steps.web-runtime.outputs.ready != 'true'
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: packages/actr-web -> ../../target/bindings-web
        cache-bin: false
        shared-key: cli-web-assets
        prefix-key: ci15-20261112-v1-baseline
    - name: Install wasm-pack
      if: steps.web-runtime.outputs.ready != 'true'
      run: |
        if ! wasm-pack --version 2>/dev/null | grep -Fxq "wasm-pack 0.15.0"; then
          cargo install wasm-pack --version 0.15.0 --locked --force
        fi
        wasm-pack --version 2>/dev/null | grep -Fxq "wasm-pack 0.15.0"
    - name: Build CLI web runtime assets
      if: steps.web-runtime.outputs.ready != 'true'
      run: bash packages/actr-web/scripts/sync-cli-assets.sh --build
    - name: Sync cached CLI web runtime assets
      if: steps.web-runtime.outputs.ready == 'true'
      run: bash packages/actr-web/scripts/sync-cli-assets.sh
    - name: Verify Web runtime before uploading
      run: |
        for file in actr_sw_host_bg.wasm actr_sw_host.js actr_sw_host.d.ts package.json; do
          test -s "packages/actr-web/dist/sw/$file" || { echo "Missing Web runtime output: $file" >&2; exit 1; }
        done
        bash packages/actr-web/scripts/sync-cli-assets.sh --check
    - name: Upload CLI web runtime assets
      uses: actions/upload-artifact@v4
      with:
        name: cli-web-runtime
        path: |
          crates/actr-cli/assets/web-runtime/actr_sw_host_bg.wasm
          crates/actr-cli/assets/web-runtime/actr_sw_host.js
        if-no-files-found: error
        retention-days: 1
    - name: Upload sw-host runtime assets
      uses: actions/upload-artifact@v4
      with:
        name: sw-host-runtime
        path: packages/actr-web/dist/sw/
        if-no-files-found: error
        retention-days: 1
    - name: Disk usage at end
      if: always()
      run: df -h /; du -sh target 2>/dev/null || true
  e2e_rust:
    name: Rust E2E Compile
    needs: determine
    if: needs.determine.outputs.e2e_rust == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v5
    - name: Prepare Linux build space
      uses: ./.github/actions/prepare-linux-build
    - name: Setup Rust
      uses: dtolnay/rust-toolchain@1.99.0
      with:
        targets: wasm32-wasip2,wasm32-unknown-unknown
    - name: Install protoc
      uses: arduino/setup-protoc@v3
      with:
        repo-token: ${{ github.token }}
        version: ${{ vars.PROTOC_VERSION || '29.3' }}
    - uses: Swatinem/rust-cache@v2
      with:
        workspaces: tests/e2e/actr -> ../target/e2e
        prefix-key: ci15-20261112-v1-baseline
    - name: Install native dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libopus-dev
    - name: Resolve e2e workspace with the committed lockfile
      working-directory: tests/e2e/actr
      run: |
        cargo metadata \
          --format-version 1 \
          --locked \
          > "$RUNNER_TEMP/e2e-metadata.json"
        python3 - "$RUNNER_TEMP/e2e-metadata.json" <<'PY'
        import json
        import pathlib
        import sys

        metadata = json.loads(pathlib.Path(sys.argv[1]).read_text())
        registry_actr = [
            package["name"]
            for package in metadata["packages"]
            if package["name"].startswith("actr") and package["source"] is not None
        ]
        if registry_actr:
            raise SystemExit(
                "e2e actr dependencies must resolve from local paths: "
                + ", ".join(sorted(registry_actr))
            )
        PY
    - name: Compile the Rust E2E workspace
      working-directory: tests/e2e/actr
      run: cargo check --workspace --locked
    - name: Disk usage at end
      if: always()
      run: df -h /; du -sh target 2>/dev/null || true
    env:
      SCCACHE_GHA_VERSION: ci15-20261112-v1-baseline
  e2e_package_runtime:
    name: E2E Package Runtime
    needs:
    - determine
    - cli_web_assets
    if: needs.determine.outputs.e2e_package_runtime == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v5
    - name: Prepare Linux build space
      uses: ./.github/actions/prepare-linux-build
    - name: Setup Rust
      uses: dtolnay/rust-toolchain@1.99.0
      with:
        targets: wasm32-unknown-unknown
    - name: Install Linux e2e dependencies
      run: |
        sudo rm -f /etc/apt/sources.list.d/google-chrome*
        sudo apt-get update
        sudo apt-get install -y jq sqlite3 lsof perl bubblewrap openssl
    - name: Install protoc
      uses: arduino/setup-protoc@v3
      with:
        repo-token: ${{ secrets.GITHUB_TOKEN }}
        version: ${{ vars.PROTOC_VERSION || '29.3' }}
    - name: Install wasm-pack
      run: |
        if ! wasm-pack --version 2>/dev/null | grep -Fxq "wasm-pack 0.15.0"; then
          cargo install wasm-pack --version 0.15.0 --locked --force
        fi
        wasm-pack --version 2>/dev/null | grep -Fxq "wasm-pack 0.15.0"
    - uses: Swatinem/rust-cache@v2
      with:
        save-if: false
        prefix-key: ci15-20261112-v1-baseline
    - name: Download CLI web runtime assets
      uses: actions/download-artifact@v4
      with:
        name: cli-web-runtime
        path: crates/actr-cli/assets/web-runtime
    - name: Sync CLI source assets
      run: |
        test -s crates/actr-cli/assets/web-runtime/actr_sw_host_bg.wasm
        test -s crates/actr-cli/assets/web-runtime/actr_sw_host.js
        bash packages/actr-web/scripts/sync-cli-assets.sh --skip-sw-host
    - name: Verify Publisher signing-key isolation
      run: python3 tests/e2e/actr/package-runtime-echo/test_runtime_isolation.py
    - name: Verify HTTPS transport and certificate rejection
      run: python3 tests/e2e/actr/package-runtime-echo/test_https_documents.py
    - name: Run signed package runtime echo e2e
      run: bash tests/e2e/actr/package-runtime-echo/run.sh
    - name: Run provider and external domain Realms
      run: bash tests/e2e/actr/package-runtime-echo/realm-matrix.sh
    - name: Verify retired and revoked Publisher signing keys
      run: MODE=rotation bash tests/e2e/actr/package-runtime-echo/run.sh
    - name: Disk usage at end
      if: always()
      run: df -h /; du -sh target 2>/dev/null || true
    env:
      SCCACHE_GHA_VERSION: ci15-20261112-v1-baseline
  audit:
    name: Dependency Audit
    needs: determine
    if: needs.determine.outputs.rust_core == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v5
    - name: Setup Rust
      uses: dtolnay/rust-toolchain@1.99.0
    - name: Install cargo-audit
      run: cargo install cargo-audit --version 0.22.2 --locked --force
    - name: Audit Cargo.lock
      run: cargo audit
    - name: Disk usage at end
      if: always()
      run: df -h /; du -sh target 2>/dev/null || true
    env:
      SCCACHE_GHA_VERSION: ci15-20261112-v1-baseline
  rust:
    name: Rust
    needs:
    - determine
    - cli_web_assets
    if: needs.determine.outputs.rust_core == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: 1
      RUSTUP_TOOLCHAIN: 1.99.0
      ACTR_REQUIRE_WASM_FIXTURE: '1'
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: 'true'
      SCCACHE_GHA_VERSION: ci15-20261112-v1-baseline
    steps:
    - uses: actions/checkout@v5
    - name: Prepare Linux build space
      uses: ./.github/actions/prepare-linux-build
    - name: Setup Rust
      uses: dtolnay/rust-toolchain@1.99.0
      with:
        components: rustfmt,clippy
        targets: wasm32-wasip2,wasm32-unknown-unknown
    - name: Install protoc
      uses: arduino/setup-protoc@v3
      with:
        repo-token: ${{ github.token }}
        version: ${{ vars.PROTOC_VERSION || '29.3' }}
    - name: Run sccache-cache
      uses: mozilla-actions/sccache-action@v0.0.9
      with:
        version: v0.18.0
    - name: OTel payload-logging guard
      run: bash .github/workflows/scripts/check-payload-logging.sh
    - name: Test mobile Issuer fixture on a non-Unix target
      run: python3 scripts/actr/tests/test_mobile_fixture_cfg.py
    - name: Install native build dependencies
      run: |
        if ! command -v pkg-config >/dev/null 2>&1 || ! pkg-config --exists openssl || ! command -v cmake >/dev/null 2>&1; then
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev cmake
        fi
    - name: Verify actr-hyper WIT drift
      run: |
        cmp crates/actr-framework/wit-v2/actr-workload.wit crates/actr-hyper/wit-v2/actr-workload.wit
    - name: Cache cargo-installed tools
      id: cargo-tools
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/bin/wasm-pack
          ~/.cargo/bin/wasm-component-ld
          ~/.cargo/bin/wasm-tools
        key: ci15-20261112-v1-baseline-cargo-tools-v2-${{ runner.os }}-wp0.15.0-wcld0.5.26-wt1.253.0
    - name: Install wasm-pack
      run: |
        if ! wasm-pack --version 2>/dev/null | grep -Fxq "wasm-pack 0.15.0"; then
          cargo install wasm-pack --version 0.15.0 --locked --force
        fi
        wasm-pack --version 2>/dev/null | grep -Fxq "wasm-pack 0.15.0"
    - name: Install wasm Component Model toolchain
      run: |
        if ! wasm-component-ld --version 2>/dev/null | grep -Fxq "wasm-component-ld 0.5.26"; then
          cargo install wasm-component-ld --version 0.5.26 --locked --force
        fi
        wasm-component-ld --version 2>/dev/null | grep -Fxq "wasm-component-ld 0.5.26"
        if ! wasm-tools --version 2>/dev/null | grep -Eq '^wasm-tools 1\.253\.0( \(.*\))?$'; then
          cargo install wasm-tools --version 1.253.0 --locked --force
        fi
        wasm-tools --version 2>/dev/null | grep -Eq '^wasm-tools 1\.253\.0( \(.*\))?$'
    - name: Download CLI web runtime assets
      uses: actions/download-artifact@v4
      with:
        name: cli-web-runtime
        path: crates/actr-cli/assets/web-runtime
    - name: Sync CLI source assets
      run: |
        test -s crates/actr-cli/assets/web-runtime/actr_sw_host_bg.wasm
        test -s crates/actr-cli/assets/web-runtime/actr_sw_host.js
        bash packages/actr-web/scripts/sync-cli-assets.sh --skip-sw-host
    - name: Check formatting
      run: cargo fmt --all -- --check
    - name: Test Rust protoc plugin well-known types
      run: cargo test -p actr-framework-protoc-codegen --test well_known_type_smoke
    - name: Verify RFC-0400 timer inventory
      run: cargo test -p actr-hyper --lib timer::tests::inv24_production_timer_calls_and_inventory_do_not_drift
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Verify upstream dependency overrides
      run: |
        python3 scripts/actr/check-upstream-patches.py
        python3 scripts/actr/tests/test_apply_upstream_patches.py
    - name: Check committed Kotlin binding checksums against the native library
      run: |
        cargo build -p libactr
        python3 scripts/actr/check-binding-checksums.py \
          --library target/debug/libactr.so \
          --binding packages/actr-kotlin/actr-kotlin/src/main/kotlin/io/actrium/actr/actr.kt
    - name: Clippy (deny warnings)
      env:
        CARGO_BUILD_WARNINGS: deny
      run: cargo +1.99.0 clippy --workspace --all-targets --all-features
    - name: Disk usage at end
      if: always()
      run: df -h /; du -sh target 2>/dev/null || true
  test:
    name: Test (Rust, ${{ matrix.shard }})
    needs:
    - determine
    - cli_web_assets
    if: needs.determine.outputs.rust_core == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        shard:
        - realtime
        - rest
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: 1
      ACTR_REQUIRE_WASM_FIXTURE: '1'
      ACTR_REQUIRE_NON_LOOPBACK_IPV4: '1'
      CARGO_PROFILE_TEST_DEBUG: '0'
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: 'true'
      REALTIME_BINARIES: binary(mobile_rtc_pair_contract) | binary(mobile_rtc_multi_peer) | (package(actr-hyper) and test(/^connection_governance_matrix::/)) | (package(actr-hyper) and test(/^connection_governance_production::/)) | (package(actr-hyper) and test(/^connection_governance_inflight::/)) | binary(recovery_attempt_timer) | binary(webrtc_large_mobile_recovery) | binary(mobile_full_disconnect_recovery) | binary(mobile_network_event_scenarios) | binary(ice_restart) | binary(ice_restart_with_signaling_disruption) | binary(ice_restart_unilateral_outage) | binary(turn_credential_rotation) | binary(webrtc_large_data_transfer) | binary(webrtc_initial_connection_timeout) | binary(media_loopback) | binary(dynclib_actor_e2e) | binary(rust_echo) | binary(outproc_disconnect_reconnect) | binary(outproc_connection_rebuild) | binary(recovery_vnet_supervisor) | binary(mock_loran_integration)
      SCCACHE_GHA_VERSION: ci15-20261112-v1-baseline
    steps:
    - uses: actions/checkout@v5
    - name: Prepare Linux build space
      uses: ./.github/actions/prepare-linux-build
    - name: Setup Rust
      uses: dtolnay/rust-toolchain@1.99.0
      with:
        components: rust-src
        targets: wasm32-wasip2,wasm32-unknown-unknown
    - name: Install protoc
      uses: arduino/setup-protoc@v3
      with:
        repo-token: ${{ github.token }}
        version: ${{ vars.PROTOC_VERSION || '29.3' }}
    - name: Verify actr-hyper WIT drift
      run: |
        cmp crates/actr-framework/wit-v2/actr-workload.wit crates/actr-hyper/wit-v2/actr-workload.wit
    - uses: Swatinem/rust-cache@v2
      with:
        cache-targets: false
        save-if: ${{ matrix.shard == 'rest' }}
        prefix-key: ci15-20261112-v1-baseline
    - name: Run sccache-cache
      uses: mozilla-actions/sccache-action@v0.0.9
      with:
        version: v0.18.0
    - name: Install prebuilt WebAssembly tools
      env:
        WASM_PACK_SHA256: c09f971ecaed9a2efc80fdcea7a00ef6b53c7fadc8c57d1f61b53a6aa66b668a
        WASM_COMPONENT_LD_SHA256: e5cee677052c0eb6b5d0605f85e3bbc46d076050cd3403406f49b3503f22622c
        WASM_TOOLS_SHA256: 4e2898f7ca3bd0536218ed9b7b36ff7b86954c57ae0e6272fde69728cbe01088
      run: |
        install_binary() {
          local name="$1"
          local expected="$2"
          local url="$3"
          local sha256="$4"
          if "$HOME/.cargo/bin/$name" --version 2>/dev/null | grep -Eq "$expected"; then
            echo "Reusing image $name"
            return
          fi
          local archive="$RUNNER_TEMP/$name.tar.gz"
          local extract_dir
          extract_dir=$(mktemp -d "$RUNNER_TEMP/$name.XXXXXX")

          curl --fail --location --retry 3 --retry-all-errors --output "$archive" "$url"
          echo "$sha256  $archive" | sha256sum --check --status
          tar --extract --gzip --file "$archive" --strip-components=1 --directory "$extract_dir"
          install --mode=0755 "$extract_dir/$name" "$HOME/.cargo/bin/$name"
          rm -rf "$archive" "$extract_dir"
          "$HOME/.cargo/bin/$name" --version | grep -Eq "$expected"
        }

        install_binary wasm-pack '^wasm-pack 0\.15\.0$' \
          https://github.com/wasm-bindgen/wasm-pack/releases/download/v0.15.0/wasm-pack-v0.15.0-x86_64-unknown-linux-musl.tar.gz \
          "$WASM_PACK_SHA256"
        install_binary wasm-component-ld '^wasm-component-ld 0\.5\.26$' \
          https://github.com/bytecodealliance/wasm-component-ld/releases/download/v0.5.26/wasm-component-ld-v0.5.26-x86_64-linux.tar.gz \
          "$WASM_COMPONENT_LD_SHA256"
        install_binary wasm-tools '^wasm-tools 1\.253\.0( \(.*\))?$' \
          https://github.com/bytecodealliance/wasm-tools/releases/download/v1.253.0/wasm-tools-1.253.0-x86_64-linux.tar.gz \
          "$WASM_TOOLS_SHA256"

        wasm-pack --version
        wasm-component-ld --version
        wasm-tools --version
    - name: Download CLI web runtime assets
      uses: actions/download-artifact@v4
      with:
        name: cli-web-runtime
        path: crates/actr-cli/assets/web-runtime
    - name: Sync CLI source assets
      run: |
        test -s crates/actr-cli/assets/web-runtime/actr_sw_host_bg.wasm
        test -s crates/actr-cli/assets/web-runtime/actr_sw_host.js
        bash packages/actr-web/scripts/sync-cli-assets.sh --skip-sw-host
    - name: Install cargo-nextest
      uses: taiki-e/install-action@cargo-nextest
    - name: Build rest test inventory and verify RFC-0507 acceptance
      if: matrix.shard == 'rest'
      run: |
        cargo metadata --format-version 1 --all-features --locked \
          > "$RUNNER_TEMP/nextest-rest-cargo.json"
        cargo nextest list --workspace --all-features \
          --list-type binaries-only --message-format json \
          > "$RUNNER_TEMP/nextest-rest-binaries.json"
        cargo nextest list \
          --cargo-metadata "$RUNNER_TEMP/nextest-rest-cargo.json" \
          --binaries-metadata "$RUNNER_TEMP/nextest-rest-binaries.json" \
          -E "not($REALTIME_BINARIES)" --message-format json \
          > "$RUNNER_TEMP/nextest-rest-tests.json"
        python3 - "$RUNNER_TEMP/nextest-rest-tests.json" <<'PY'
        import json
        import sys

        acceptance = "outbound::peer_gate::websocket_tests::live_websocket_partial_write_is_uncertain_without_replay"
        with open(sys.argv[1]) as source:
            inventory = json.load(source)
        selected = []
        for suite in inventory["rust-suites"].values():
            if suite["package-name"] != "actr-hyper" or suite["kind"] != "lib":
                continue
            case = suite.get("testcases", {}).get(acceptance)
            if case and not case["ignored"] and case["filter-match"]["status"] == "matches":
                selected.append(suite["binary-id"])
        if len(selected) != 1:
            raise SystemExit("RFC-0507 acceptance must be selected exactly once in the rest shard")
        print(f"RFC-0507 acceptance selected in {selected[0]}; the rest suite runs it without retries")
        PY
    - name: Run tests (nextest, ${{ matrix.shard }} shard)
      run: |
        if [ "${{ matrix.shard }}" = realtime ]; then
          cargo nextest run --workspace --all-features --no-fail-fast -E "$REALTIME_BINARIES"
        else
          cargo nextest run \
            --cargo-metadata "$RUNNER_TEMP/nextest-rest-cargo.json" \
            --binaries-metadata "$RUNNER_TEMP/nextest-rest-binaries.json" \
            --no-fail-fast -E "not($REALTIME_BINARIES)"
        fi
    - name: Run doctests
      if: matrix.shard == 'rest'
      run: cargo test --doc --workspace --all-features
    - name: sccache stats
      if: always()
      run: sccache --show-stats || true
    - name: Disk usage at end
      if: always()
      run: df -h /; du -sh target 2>/dev/null || true
  rust_msrv:
    name: Rust MSRV (1.95)
    needs:
    - determine
    - cli_web_assets
    if: needs.determine.outputs.rust_core == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: 1
      ACTR_REQUIRE_WASM_FIXTURE: '1'
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: 'true'
      SCCACHE_GHA_VERSION: ci15-20261112-v1-baseline
    steps:
    - uses: actions/checkout@v5
    - name: Prepare Linux build space
      uses: ./.github/actions/prepare-linux-build
    - name: Install protoc
      uses: arduino/setup-protoc@v3
      with:
        repo-token: ${{ github.token }}
        version: ${{ vars.PROTOC_VERSION || '29.3' }}
    - name: Run sccache-cache
      uses: mozilla-actions/sccache-action@v0.0.9
      with:
        version: v0.18.0
    - name: Setup Rust (MSRV)
      uses: dtolnay/rust-toolchain@1.95.0
      with:
        targets: wasm32-wasip2,wasm32-unknown-unknown
    - name: Clear repository Rust toolchain override
      run: rustup override unset || true
    - name: Install native build dependencies
      run: |
        if ! command -v pkg-config >/dev/null 2>&1 || ! pkg-config --exists openssl || ! command -v cmake >/dev/null 2>&1; then
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev cmake
        fi
    - name: Cache cargo-installed tools
      id: cargo-tools
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/bin/wasm-pack
          ~/.cargo/bin/wasm-component-ld
          ~/.cargo/bin/wasm-tools
        key: ci15-20261112-v1-baseline-cargo-tools-v2-${{ runner.os }}-wp0.15.0-wcld0.5.26-wt1.253.0
    - name: Install wasm-pack
      run: |
        if ! wasm-pack --version 2>/dev/null | grep -Fxq "wasm-pack 0.15.0"; then
          cargo install wasm-pack --version 0.15.0 --locked --force
        fi
        wasm-pack --version 2>/dev/null | grep -Fxq "wasm-pack 0.15.0"
    - name: Install wasm Component Model toolchain
      run: |
        if ! wasm-component-ld --version 2>/dev/null | grep -Fxq "wasm-component-ld 0.5.26"; then
          cargo install wasm-component-ld --version 0.5.26 --locked --force
        fi
        wasm-component-ld --version 2>/dev/null | grep -Fxq "wasm-component-ld 0.5.26"
        if ! wasm-tools --version 2>/dev/null | grep -Eq '^wasm-tools 1\.253\.0( \(.*\))?$'; then
          cargo install wasm-tools --version 1.253.0 --locked --force
        fi
        wasm-tools --version 2>/dev/null | grep -Eq '^wasm-tools 1\.253\.0( \(.*\))?$'
    - name: Download CLI web runtime assets
      uses: actions/download-artifact@v4
      with:
        name: cli-web-runtime
        path: crates/actr-cli/assets/web-runtime
    - name: Sync CLI source assets
      run: |
        test -s crates/actr-cli/assets/web-runtime/actr_sw_host_bg.wasm
        test -s crates/actr-cli/assets/web-runtime/actr_sw_host.js
        bash packages/actr-web/scripts/sync-cli-assets.sh --skip-sw-host
    - name: Build at MSRV (locked)
      run: cargo build --workspace --all-targets --all-features --locked
    - name: Disk usage at end
      if: always()
      run: df -h /; du -sh target 2>/dev/null || true
