  swift:
    name: Swift
    needs: determine
    if: needs.determine.outputs.swift_binding == 'true'
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v5
    - name: Set up Rust
      uses: dtolnay/rust-toolchain@1.99.0
      with:
        targets: aarch64-apple-darwin
    - uses: Swatinem/rust-cache@v2
      with:
        prefix-key: ci15-20261112-v1-baseline
    - name: Install protoc
      uses: arduino/setup-protoc@v3
      with:
        repo-token: ${{ github.token }}
        version: ${{ vars.PROTOC_VERSION || '29.3' }}
    - name: Cache uniffi-bindgen binary
      id: cache-uniffi
      uses: actions/cache@v4
      with:
        path: ~/.cargo/bin/uniffi-bindgen*
        key: ci15-20261112-v1-baseline-uniffi-bindgen-0.31.1-${{ runner.os }}-${{ runner.arch }}
    - name: Install UniFFI bindgen
      if: steps.cache-uniffi.outputs.cache-hit != 'true'
      run: |
        # Swatinem/rust-cache may already restore ~/.cargo/bin/uniffi-bindgen
        # from a prior run with a different key; skip the install when the
        # binary is present so the unguarded `cargo install` doesn't abort
        # with "binary already exists in destination".
        if ! command -v uniffi-bindgen >/dev/null 2>&1; then
          cargo install --locked uniffi --version 0.31.1 --features cli --bin uniffi-bindgen
        fi
    - name: Install Swift tools and libraries
      run: brew install swiftlint opus
    - name: Run SwiftLint
      run: swiftlint lint --strict
    - name: Check actr-cabi header sync
      run: git diff --no-index --exit-code -- crates/actr-cabi/actr-cabi.h packages/actr-cabi/swift/Sources/ActrCabi/include/actr-cabi.h
    - name: Type-check actr-cabi Swift wrapper
      run: swiftc -typecheck -swift-version 6 -I packages/actr-cabi/swift/Sources/ActrCabi/include packages/actr-cabi/swift/Sources/ActrCabi/ActrCabi.swift
    - name: Build local Swift XCFramework
      working-directory: packages/actr-swift
      env:
        ACTR_BUILD_PROFILE: debug
        ACTR_XCFRAMEWORK_TARGETS: macos
        CMAKE_POLICY_VERSION_MINIMUM: '3.5'
      run: |
        ./build-xcframework.sh
    - name: Build Swift bindings package
      working-directory: packages/actr-swift
      run: |
        swift build
    - name: Pre-build mock-loran
      run: cargo build -p actr-mock-loran --bin mock-loran
    - name: Test Swift bindings package
      working-directory: packages/actr-swift
      env:
        ACTR_SWIFT_E2E: '1'
      run: |
        ../../target/debug/mock-loran --port 8081 > "$RUNNER_TEMP/mock-loran.log" 2>&1 &
        mock_pid="$!"
        trap 'kill "$mock_pid" || true' EXIT
        for _ in {1..60}; do
          if grep -q "mock-loran listening" "$RUNNER_TEMP/mock-loran.log"; then
            cat "$RUNNER_TEMP/mock-loran.log"
            break
          fi
          if ! kill -0 "$mock_pid" 2>/dev/null; then
            cat "$RUNNER_TEMP/mock-loran.log"
            exit 1
          fi
          sleep 1
        done
        if ! grep -q "mock-loran listening" "$RUNNER_TEMP/mock-loran.log"; then
          cat "$RUNNER_TEMP/mock-loran.log"
          exit 1
        fi
        ACTR_BINDINGS_PATH=dist/ActrBindings \
        ACTR_BINARY_PATH=dist/ActrFFI.xcframework \
        swift test
    - name: Build Swift codegen package
      working-directory: tools/actr/protoc-gen/swift
      run: swift build
    - name: Disk usage at end
      if: always()
      run: df -h /; du -sh target 2>/dev/null || true
    env:
      SCCACHE_GHA_VERSION: ci15-20261112-v1-baseline
