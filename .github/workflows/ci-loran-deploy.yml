name: CI (Loran deploy)

# loran/deploy is a self-contained bootstrap CLI kept in its own sub-workspace
# (excluded from the actr root workspace, no actr/loran dependencies), so it
# gets its own job that only runs when deploy changes.
on:
  push:
    branches: [main]
    paths:
      - "loran/deploy/**"
      - ".github/workflows/ci-loran-deploy.yml"
  pull_request:
    branches: [main]
    paths:
      - "loran/deploy/**"
      - ".github/workflows/ci-loran-deploy.yml"

permissions:
  contents: read

defaults:
  run:
    working-directory: loran/deploy

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: fmt / clippy / build / test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: rustfmt,clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: loran/deploy -> target

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        env:
          CARGO_BUILD_WARNINGS: deny
        run: cargo +1.99.0 clippy --all-targets --all-features

      - name: Build
        run: cargo build --all-features

      - name: Test
        run: cargo test --all-features
