name: Security formal checks

on:
  pull_request:
    paths:
      - "docs/architecture/security/actrium/formal/**"
      - ".github/workflows/actrium-security-formal.yml"
  push:
    branches:
      - main
    paths:
      - "docs/architecture/security/actrium/formal/**"
      - ".github/workflows/actrium-security-formal.yml"

permissions:
  contents: read

jobs:
  proof-suite:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install z3
        run: pip install "z3-solver>=4.12"

      - name: Run proof suite (theory / z3 / STS / channel / mutants)
        run: python3 docs/architecture/security/actrium/formal/proof/check_proofs.py

      - name: Run finite-model regression
        run: python3 docs/architecture/security/actrium/formal/check_formal_model.py
