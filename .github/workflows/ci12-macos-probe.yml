name: Actrium macOS snapshot validation

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Publish a snapshot of this repository's main, or replace assets on an existing release.
        type: choice
        options: [snapshot, existing-tag]
        default: snapshot
        required: true
      tag:
        description: Existing release tag (only used by existing-tag).
        type: string
        required: false
      publish:
        description: Publish the verified DMG; false exercises artifact-only dry run.
        type: boolean
        default: true
      source_sha:
        description: Validation-only source SHA for a second-commit snapshot; empty uses main.
        type: string
        required: false
      promote_verified_artifact:
        description: QA only - replay the legacy verified build from run 44059384011.
        type: boolean
        default: false
      smoke_published:
        description: Only install and test previously published DMGs.
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  smoke:
    if: inputs.smoke_published
    uses: ./.github/workflows/actrium-release-smoke.yml

  resolve:
    if: ${{ !inputs.smoke_published && !inputs.promote_verified_artifact }}
    name: Pin release source
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.context.outputs.tag }}
      source_sha: ${{ steps.context.outputs.source_sha }}
      app_version: ${{ steps.context.outputs.app_version }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Resolve immutable source and version
        id: context
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_MODE: ${{ inputs.mode || 'snapshot' }}
          RELEASE_TAG: ${{ inputs.tag }}
          VALIDATION_SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          if [[ -z "$VALIDATION_SOURCE_SHA" ]]; then
            python3 scripts/actrium/release-macos.py resolve --mode "$RELEASE_MODE" --tag "$RELEASE_TAG"
          else
            python3 - <<'PY'
          import base64
          import os
          from pathlib import Path
          import runpy
          import tomllib

          helpers = runpy.run_path('scripts/actrium/release-macos.py')
          sha = os.environ['VALIDATION_SOURCE_SHA']
          tag = f'actrium-{sha[:8]}'
          helpers['check_tag'](tag, sha)
          helpers['check_destination'](tag, sha, True)
          cargo_file = helpers['api'](f'contents/Cargo.toml?ref={sha}')
          cargo = tomllib.loads(base64.b64decode(cargo_file['content']).decode())
          version = helpers['numeric_version'](cargo['workspace']['package']['version'])
          with Path(os.environ['GITHUB_OUTPUT']).open('a') as output:
              output.write(f'tag={tag}\nsource_sha={sha}\napp_version={version}\n')
          PY
          fi
      - name: Seed unrelated attachment on the QA release
        if: inputs.mode == 'existing-tag' && inputs.tag == '0.10.7-macos-backfill-validation'
        env:
          GH_TOKEN: ${{ github.token }}
          QA_TAG: ${{ inputs.tag }}
        run: |
          printf '%s\n' 'Unrelated release attachment: retain this file during browser backfill.' > KEEP.txt
          gh release upload "$QA_TAG" KEEP.txt --repo "$GITHUB_REPOSITORY" --clobber

  release:
    if: ${{ !inputs.smoke_published && !inputs.promote_verified_artifact }}
    name: Package and publish browser
    needs: resolve
    permissions:
      contents: write
    uses: ./.github/workflows/_actrium-macos-release.yml
    with:
      tag: ${{ needs.resolve.outputs.tag }}
      source_sha: ${{ needs.resolve.outputs.source_sha }}
      app_version: ${{ needs.resolve.outputs.app_version }}
      publish: ${{ github.event_name == 'push' || inputs.publish }}
      create_snapshot: ${{ github.event_name == 'push' || inputs.mode == 'snapshot' }}

  promote:
    name: Publish verified new-main artifact
    if: inputs.promote_verified_artifact && !inputs.smoke_published
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 44059384011
          name: actrium-macos-actrium-2f7c5eb20ea2
          path: artifacts
      - name: Validate the completed build provenance
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          import runpy

          info = json.loads(Path('artifacts/actrium-build.json').read_text())
          assert info['source_sha'] == '2f7c5eb20ea2d28d530d89f53125f056d0165d1e'
          assert info['tag'] == 'actrium-2f7c5eb20ea2'
          assert info['app_version'] == '0.10.7' and info['build_number'] == '11'
          expected_run = f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/44059384011"
          assert info['run_url'] == expected_run
          runpy.run_path('scripts/actrium/release-macos.py')['check_tag'](info['tag'], info['source_sha'])
          with Path(os.environ['GITHUB_ENV']).open('a') as output:
              output.write(f"RELEASE_TAG={info['tag']}\nRELEASE_SHA={info['source_sha']}\nAPP_VERSION={info['app_version']}\n")
          PY
      - name: Publish the already verified DMG and checksum
        env:
          GH_TOKEN: ${{ github.token }}
          CREATE_SNAPSHOT: "true"
        run: python3 scripts/actrium/release-macos.py publish --assets artifacts
