[workspace]
resolver = "2"
members = [
    # === Actr ===
    "crates/actr",
    "crates/actr-protocol",
    "crates/actr-relay-security",
    "crates/actr-service-compat",
    "crates/actr-config",
    "crates/actr-framework",
    "crates/actr-hyper",
    "crates/actr-runtime",
    "crates/actr-runtime-mailbox",
    "crates/actr-platform-traits",
    "crates/actr-platform-native",
    "crates/actr-pack",
    "crates/actr-hlc",
    # === Keel ===
    "crates/keel-native-guest",
    # === Actrium applications ===
    "crates/actrium-core",
    "crates/actrium-sync",
    "crates/actrium-vault",
    # === Developer Tools ===
    "tools/actr/protoc-gen/rust",
    "tools/actr/protoc-gen/web",
    "tools/actr/wit-compile-web",
    "tools/actr/wit-lint",
    # === CLI ===
    "crates/actr-cli",
    # === Language Bindings (Rust FFI) ===
    "crates/actr-ffi",
    # === C ABI Primitives ===
    "crates/actr-cabi",
    # === Testing Utilities ===
    "crates/actr-mock-loran",
    "crates/actr-error-fixture",
    # === Loran service suite ===
    "crates/loran-*",
]

# === Excluded from Cargo workspace ===
# - examples: independent workspaces simulating external users
# - bindings/{python,typescript,swift,kotlin}: non-Rust build systems
# - tools/actr/protoc-gen/{typescript,python,swift,kotlin}: non-Rust plugins
exclude = [
    "examples/actr/rust/*",
    "examples/actr/audio-capture/*",
    "packages/actr-web",
    "packages/actr-python",
    "packages/actr-typescript",
    "packages/actr-swift",
    "packages/actr-kotlin",
    "tools/actr/protoc-gen/typescript",
    "tools/actr/protoc-gen/python",
    "tools/actr/protoc-gen/swift",
    "tools/actr/protoc-gen/kotlin",
    # Keel's demo guests retain their own WASM-oriented workspace.
    "examples/keel/guests/rust",
    # Loran deploy is an independent sub-workspace (own [workspace]).
    "loran/deploy",
]

[workspace.package]
version = "0.11.0"
edition = "2024"
rust-version = "1.95"
license = "Apache-2.0"
repository = "https://github.com/Actrium/actrium"
authors = ["Actor-RTC Contributors"]

[workspace.lints.clippy]
collapsible_if = "allow"
collapsible_else_if = "allow"

[workspace.dependencies]
# === Internal Dependencies ===
actr-protocol = { path = "crates/actr-protocol", version = "0.11.0" }
proto-fingerprint = "0.1.0"
actr-service-compat = { path = "crates/actr-service-compat", version = "0.11.0" }
actr-config = { path = "crates/actr-config", version = "0.11.0" }
actr-framework = { path = "crates/actr-framework", version = "0.11.0" }
actr-framework-protoc-codegen = { path = "tools/actr/protoc-gen/rust", version = "0.11.0" }
actr-runtime = { path = "crates/actr-runtime", version = "0.11.0" }
actr-runtime-mailbox = { path = "crates/actr-runtime-mailbox", version = "0.11.0" }
actr-hyper = { path = "crates/actr-hyper", version = "0.11.0" }
actr-platform-traits = { path = "crates/actr-platform-traits", version = "0.11.0" }
actr-platform-native = { path = "crates/actr-platform-native", version = "0.11.0" }
actr-pack = { path = "crates/actr-pack", version = "0.11.0" }
actr-hlc = { path = "crates/actr-hlc", version = "0.5.9" }
actr-mock-loran = { path = "crates/actr-mock-loran", version = "0.11.0" }

# === Async Runtime ===
tokio = { version = "1.48", features = ["full"] }
async-trait = "0.1"
futures-util = "0.3"

# === Serialization ===
prost = "0.14"
prost-types = "0.14"
prost-build = "0.14"
bytes = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.22"
toml = "1.0.6"

# === Utilities ===
uuid = { version = "1.18", features = ["v4", "serde"] }
thiserror = "2.0"
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
url = "2.5"
if-addrs = "0.15"
pwrzv = "0.6.2"
yasm = "0.6.0"

# === Logging ===
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# === Observability ===
opentelemetry = { version = "0.32.0", features = ["trace", "logs"] }
opentelemetry_sdk = { version = "0.32.1", features = ["rt-tokio", "logs"] }
opentelemetry-otlp = { version = "0.32.0", features = ["grpc-tonic", "tls", "logs"] }
opentelemetry-appender-tracing = "0.32.0"
tracing-opentelemetry = "0.33.0"

# === WebRTC ===
# Keep the RTC crates on the same upstream source and submodule revision.
# TODO(#359): Switch to registry releases once they contain the required fixes.
webrtc = { version = "=0.21.1", git = "https://github.com/webrtc-rs/webrtc", rev = "8ea6e2a69b0c4c97f38b0e81e5a77e1c066f3757", default-features = false, features = ["runtime-tokio", "crypto-ring"] }
rtc = { version = "=0.21.1", git = "https://github.com/webrtc-rs/webrtc", rev = "8ea6e2a69b0c4c97f38b0e81e5a77e1c066f3757", default-features = false, features = ["crypto-ring"] }
rtc-rtp = { version = "=0.21.1", git = "https://github.com/webrtc-rs/webrtc", rev = "8ea6e2a69b0c4c97f38b0e81e5a77e1c066f3757" }

# === Loran server dependencies ===
# Keep STUN, TURN, and webrtc-util on the same released upstream version.
turn_crate = { package = "turn", version = "=0.17.3" }
webrtc-stun = { package = "stun", version = "=0.17.3" }
stun-protocol = { package = "stun", version = "=0.17.3" }
webrtc-util = { version = "=0.17.3" }
tonic = { version = "0.14", features = ["tls-ring", "tls-native-roots"] }
tonic-prost = "0.14"
tonic-prost-build = "0.14"
axum = { version = "0.8.7", features = ["json", "macros"] }
# Keep Rustls on WebPKI 0.103.x so an older 0.102.x verifier cannot coexist.
rustls = { version = "0.23.27" }
# Enforce the emSign verification fix in published crates and downstream locks.
rustls-webpki = { version = "0.103.16", default-features = false }
rustls-pki-types = { version = "1.9", features = ["std"] }
tokio-rustls = { version = "0.26.2", features = ["logging"] }
nonce-auth = { version = "0.6.3" }
reqwest = { version = "0.12.24", features = ["json"] }
serial_test = "3.0"
hex = "0.4.3"
hkdf = "0.12"
hmac = "0.12"
# SQLx #4502 allows patched libsqlite3-sys 0.39. Keep this pinned upstream
# revision until a published release includes that fix.
sqlx = { version = "=0.9.0", git = "https://github.com/transact-rs/sqlx", rev = "10462fa4414c6c7f1ed1d39bb31678e3b726878c", default-features = false, features = [
    "runtime-tokio",
    "tls-rustls-ring",
    "sqlite",
] }

# === Cryptography ===
ed25519-dalek = { version = "2", features = ["rand_core"] }
sha2 = "0.10"
rand = "0.8"

# === Storage ===
# Preserve cached statements and checked u64/usize SQLite conversions.
rusqlite = { version = "0.41.1", default-features = false, features = ["bundled", "cache", "fallible_uint", "serde_json"] }

# === WASM Runtime ===
# Pinned to 48.0.8 for Component Model host execution (Rust >= 1.95).
# This includes the 2026-10-19 fixes for RUSTSEC-2026-0378/0379 and
# the earlier WASI sandbox and host-panic security fixes in the 48.x line.
#
# The `async` feature powers the host-side wasmtime fibers we rely on
# (`instantiate_async` / `call_async`); `component-model-async` stays enabled
# as forward wiring for the M4 async world (the host still runs the 0.1.0
# synchronous WIT world with a `&mut Store` serial dispatch here).
#
# NB (M3): guest components are now lifted *synchronously* (wit-bindgen 0.58
# with `async: true` removed). wasmtime's embedded wasmparser rejects the
# async canonical option on sync WIT function types (unchanged in 48 —
# crates/actr-hyper/tests/legacy_package_rejection.rs gates this), so old
# async-lift `.actr` binaries no longer load; WasmHost::compile maps that
# error to a rebuild-with-current-SDK diagnostic.
#
# `default-features = false` keeps the feature set minimal: 48's default
# additions (gc-*, wat, profiling, parallel-compilation, pooling-allocator,
# wit-parser, ...) are not pulled in and are not needed.
wasmtime = { version = "=48.0.8", default-features = false, features = [
    "runtime",
    "cranelift",
    "component-model",
    "component-model-async",
    "async",
] }
wasmtime-wasi = "=48.0.8"

# === Networking ===
tokio-tungstenite = { version = "0.28.0", features = [
    "rustls-tls-native-roots",
    "rustls-tls-webpki-roots",
] }
tokio-test = "0.4"
dashmap = "5.5"
crossbeam = "0.8"

# === Code Generation ===
quote = "1.0"
proc-macro2 = "1.0"
heck = "0.5"

# === CLI Tools ===
clap = { version = "4.5", features = ["derive", "cargo"] }
fs_extra = "1.3"
tempfile = "3.23"

[profile.dev]
opt-level = 0
debug = true

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = false
